<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renew Parts: implant parts inventory (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EBEE; --surface:#FFFFFF; --surface2:#F3F5F7; --ink:#16212B; --muted:#56636F; --line:#CBD3DA;
  --accent:#1D5DA8; --accent-ink:#FFFFFF; --accent-soft:#E2EBF6;
  --label:#F2C232; --label-ink:#17140A; --holder:#7C8893;
  --ok:#2A7649; --ok-soft:#E0F0E6; --low:#9E5D00; --low-soft:#FBEED6; --out:#AE2A20; --out-soft:#F8E0DD;
  --rest:#5F4597; --rest-soft:#ECE6F6; --none:#56636F; --none-soft:#E9EDF0;
  --font:'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --cond:'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A20; --surface:#1B242C; --surface2:#212C35; --ink:#E5EBF0; --muted:#9BA8B4; --line:#33414D;
    --accent:#5E9DE8; --accent-ink:#0C1824; --accent-soft:#1D3045;
    --label:#E9BA2C; --label-ink:#17140A; --holder:#4B5966;
    --ok:#62C690; --ok-soft:#1B3226; --low:#E8A440; --low-soft:#392B14; --out:#F27A6E; --out-soft:#3D1F1C;
    --rest:#B6A0EA; --rest-soft:#2C2540; --none:#9BA8B4; --none-soft:#26313A;
  }
}
:root[data-theme="dark"]{
  --bg:#131A20; --surface:#1B242C; --surface2:#212C35; --ink:#E5EBF0; --muted:#9BA8B4; --line:#33414D;
  --accent:#5E9DE8; --accent-ink:#0C1824; --accent-soft:#1D3045;
  --label:#E9BA2C; --label-ink:#17140A; --holder:#4B5966;
  --ok:#62C690; --ok-soft:#1B3226; --low:#E8A440; --low-soft:#392B14; --out:#F27A6E; --out-soft:#3D1F1C;
  --rest:#B6A0EA; --rest-soft:#2C2540; --none:#9BA8B4; --none-soft:#26313A;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 16px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.mark{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark .glyph{background:var(--label);color:var(--label-ink);font-family:var(--cond);font-weight:700;font-size:20px;line-height:1;padding:6px 7px;border-radius:3px;box-shadow:0 0 0 3px var(--holder)}
.mark b{display:block;font-size:18px;font-weight:700;letter-spacing:.01em}
.mark small{display:block;color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;font-weight:500;cursor:pointer}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge{min-width:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;text-align:center;line-height:20px}
.side-foot{margin-top:auto;padding:0 6px;font-size:13px;color:var(--muted)}
.side-foot button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.sample{font-size:14px;color:var(--low);background:var(--low-soft);padding:4px 10px;border-radius:6px;font-weight:500}
.roles{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:5px 11px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.content{padding:26px 28px 80px;max-width:1080px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;gap:8px}
  .side-foot{display:none}
  .top{padding:10px 14px}
  .content{padding:18px 14px 80px}
}

/* Type */
h1{font-size:30px;line-height:1.15;margin:0 0 4px;font-weight:700;letter-spacing:-.005em}
h2{font-size:21px;line-height:1.25;margin:0 0 10px;font-weight:700}
h3{font-size:17px;margin:0 0 8px;font-weight:700}
.lede{margin:0;color:var(--muted);max-width:62ch}
.vh{margin-bottom:20px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;padding:11px 18px;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--rest);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:44px}
input.big{font-size:22px;font-weight:600;width:min(260px,100%);letter-spacing:.04em}

/* Bin label: the signature element */
.bin{display:inline-flex;padding:3px;border-radius:5px;background:var(--holder);vertical-align:middle}
.bin span{display:block;background:var(--label);color:var(--label-ink);font-family:var(--cond);font-weight:700;line-height:1;border-radius:2px;padding:4px 7px;font-size:17px;min-width:2.6em;text-align:center}
.bin.xl{padding:6px;border-radius:9px}
.bin.xl span{font-size:84px;padding:14px 22px 10px;min-width:2.2em;border-radius:4px}
.loc{display:inline-flex;align-items:center;font-weight:700;border-radius:6px;padding:4px 9px;font-size:14px;line-height:1.2;vertical-align:middle}
.loc-rest{background:var(--rest-soft);color:var(--rest);border:2px solid var(--rest)}
.loc-tbd{background:transparent;color:var(--accent);border:2px dashed var(--accent)}
.loc-order{background:transparent;color:var(--muted);border:2px dashed var(--muted)}
.loc.xl{font-family:var(--cond);font-size:40px;padding:18px 22px;border-radius:12px;border-width:3px;max-width:6.5em;line-height:1.05}

/* Pills */
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-low{background:var(--low-soft);color:var(--low)}
.p-out{background:var(--out-soft);color:var(--out)}
.p-rest{background:var(--rest-soft);color:var(--rest)}
.p-none{background:var(--none-soft);color:var(--none)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

/* Finder */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.crumbs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.crumbs button b{font-weight:700}
.crumbs button:hover{border-color:var(--accent)}
.stepq{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stepq h2{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 15px;cursor:pointer;min-height:64px}
.tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile b{font-size:17px;font-weight:700;line-height:1.25}
.tile .sub{font-size:14px;color:var(--muted)}
.tile .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.tile.feature{border-color:var(--accent);border-width:2px}
.dk{margin-top:14px}
.plink{font-weight:600;color:var(--accent);text-underline-offset:3px;white-space:nowrap}
.rx-pref{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface2)}
.rx-pref dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0}
.rx-pref dt{color:var(--muted)}
.rx-pref dd{margin:0;font-weight:600}
.rx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rx-raw{margin:0 0 10px;font-size:19px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 9px;font-size:14px;font-weight:600}
.chip>span{font-weight:500;color:var(--muted);font-size:12px}
.chip.soft{background:transparent;border-style:dashed}
.chip.ref{background:var(--rest-soft);border-color:var(--rest);color:var(--rest)}
.rx-saved{color:var(--ok);font-weight:600;margin:10px 0 0}
.rx-notes{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.rx-q{margin-top:14px}
.ai-status{font-size:14px;color:var(--muted)}
.rail{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.rail li{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;background:var(--surface)}
.rail li span{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:var(--surface2);font-size:12px}
.rail li.done{color:var(--ok);border-color:var(--ok)}.rail li.done span{background:var(--ok);color:#fff}
.rail li.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}.rail li.cur span{background:var(--accent);color:#fff}
.next{margin:0 0 14px;font-size:15px}.next.ok{color:var(--ok)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.ck{font-size:13px;border-radius:6px;padding:3px 8px;border:1px solid}
.ck.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ck.as{background:var(--low-soft);border-color:var(--low);color:var(--low)}
.ck.no{background:var(--out-soft);border-color:var(--out);color:var(--out)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.dm{margin:12px 0 4px;max-width:260px}.dm-t{font-size:12px;color:var(--muted);margin-bottom:4px}
.dm-g{display:grid;gap:3px;background:var(--line);padding:4px;border-radius:8px}
.dm-c{height:26px;background:var(--surface);border-radius:3px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dm-c.dm-empty{background:var(--surface2)}.dm-c.on{background:var(--label);color:var(--label-ink);outline:2px solid var(--label-ink)}
@media print{.side,.top,.actions,.btn,.nav,.toast{display:none!important}.content{padding:0}.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm}.lbl{break-inside:avoid}}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.lbl{border:1.5px solid var(--ink);border-radius:6px;padding:8px 10px;background:#fff;color:#111;min-height:78px}
.lbl .lb-a{font-size:22px;font-weight:800;line-height:1}.lbl .lb-n{font-size:13px;font-weight:700;margin-top:4px}.lbl .lb-s{font-size:11px;color:#444}
.rx-q>b{display:block;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;min-height:38px}
.opt:hover{background:var(--accent-soft)}
.opt-guess{border-style:dashed}
.rx-parts{margin-top:12px}
.rx-next{margin:12px 0 0;color:var(--muted)}
.rx-save{margin-top:14px}
.rx-save input{flex:1 1 240px}
textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;font:inherit;color:inherit;width:100%;resize:vertical}

.views-wrap{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.view{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px;text-align:center}
.view figcaption{font-weight:700;font-size:14px;text-align:left}
.view svg{width:100%;max-width:170px;height:auto;display:block;margin:4px auto 0}
.view-img{width:100%;max-width:170px;height:auto;display:block;margin:4px auto 0;background:#fff;border-radius:8px}
.view p{margin:6px 0 0;font-size:13px;line-height:1.3;color:var(--muted)}
.keys{margin:14px 0 0;padding-left:20px}
.keys li{margin:4px 0}
.s-l{fill:var(--surface);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.s-h{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round}
.s-hl{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.s-d{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.s-t{fill:var(--muted);font:700 11px var(--font)}
.p-dess{background:#1F7A78;color:#fff}
.drv{display:inline;font-size:15px}
.drv-miss{color:var(--low);font-weight:600;font-size:14px}
.drawer .views{gap:8px}
@media (max-width:520px){.views{gap:6px}.view{padding:8px 6px}}

.ic{flex:none;display:block}
.ic-in{display:inline-block;vertical-align:-5px;margin-right:6px;color:var(--muted)}
.pthumb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:44px;vertical-align:middle;margin-right:8px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px;flex:none}
.pthumb svg,.pthumb img{width:100%;height:100%;display:block;object-fit:contain}
.pthumb text,.pthumb g[stroke="#868b92"]{display:none}
.li .nm .pthumb{float:left;width:42px;height:60px;margin:0 12px 0 0}
.tile.has-ic{flex-direction:row;align-items:center;gap:14px}
.tile-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.ic-tile{color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px;width:56px;height:56px}
.tile.has-ic:hover .ic-tile{background:var(--surface)}
.ic-set{color:var(--muted)}
.result-l{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.part-sketch{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 12px 10px;max-width:220px;text-align:center}
.part-sketch .ic{color:var(--ink)}
.part-sketch span{font-size:12px;line-height:1.3}
@media (max-width:640px){.result-l{flex-direction:row;align-items:center}.part-sketch{max-width:150px}}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0}
.note.rest{border-color:var(--rest);background:var(--rest-soft)}
.note.low{border-color:var(--low);background:var(--low-soft)}

.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.result h2{font-size:26px;margin:2px 0 4px}
.ctx{margin:0;color:var(--muted);font-weight:500}
.pn{margin:2px 0 10px;color:var(--muted);font-size:14px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface2);width:42px;height:44px;font-size:20px;font-weight:700;cursor:pointer}
.stepper output{min-width:46px;text-align:center;font-weight:700;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:16px}
@media (max-width:640px){.result{grid-template-columns:1fr;gap:16px}.bin.xl span{font-size:64px}}

.setline{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.setline:first-child{border-top:0}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.click{cursor:pointer}
.li.sel{box-shadow:inset 0 0 0 2px var(--accent);border-radius:8px}
.opt[aria-pressed="true"]{background:var(--accent);color:#fff}
.chg-panel h3{margin:18px 0 8px}
.chg-panel h3:first-child{margin-top:0}
.scroll-list{max-height:420px;overflow-y:auto}
.li.click:hover{background:var(--surface2)}
.li .nm{font-weight:600}
.li .sb{font-size:14px;color:var(--muted)}
.li .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.num{font-family:var(--cond);font-weight:700;font-size:22px;line-height:1}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.filters input{flex:1 1 220px}

/* Status strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.strip button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer}
.strip button:hover{border-color:var(--accent)}
.strip .num{font-size:40px;display:block;margin-bottom:2px}
.strip .s-out .num{color:var(--out)}
.strip .s-low .num{color:var(--low)}
.strip .s-req .num{color:var(--rest)}
.strip .s-ord .num{color:var(--accent)}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.orderday{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px 20px}
.orderday h2{margin:0}

/* Chart */
.chartwrap{overflow-x:auto}
.chart{width:100%;min-width:560px;height:auto;display:block}
.drawer .chart{min-width:0}
.chart .bar{fill:var(--accent)}
.chart .bar.cur{fill:var(--accent);opacity:.5}
.chart text{fill:var(--muted);font-size:13px;text-anchor:middle;font-family:var(--font)}
.chart .bv{fill:var(--ink);font-weight:700}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(480px,100%);height:100%;overflow:auto;padding:22px 22px calc(30px + env(safe-area-inset-bottom,0px));padding-top:calc(22px + env(safe-area-inset-top,0px));box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer .x{float:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:14px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:60;max-width:min(560px,92vw)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.gate{font-size:14px;color:var(--muted)}
.done li{margin:6px 0}
.stk-wrap{max-width:900px}
.stk-stage{position:relative;height:min(64vh,560px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--surface,#fff) 0%,var(--surface2,#f1f3f6) 75%);touch-action:none}
.stk-stage canvas{width:100%;height:100%;display:block;outline:none;cursor:grab}
.stk-stage canvas:active{cursor:grabbing}
.stk-layer{position:absolute;left:12px;top:10px;font-size:13px;background:var(--surface,#fff);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.stk-nav{position:absolute;top:22%;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface,#fff);font-size:26px;line-height:1;cursor:pointer}
.stk-nav.l{left:10px}.stk-nav.r{right:10px}
.stk-dwell{position:absolute;left:50%;top:10px;transform:translateX(-50%);--p:0;padding:4px 12px;border-radius:999px;font-size:13px;background:conic-gradient(var(--acc,#2b5fa8) calc(var(--p)*360deg),var(--line,#ddd) 0);color:#fff}
.stk-dwell span{background:var(--acc,#2b5fa8);border-radius:999px;padding:2px 8px}
.stk-info{text-align:center;margin-top:10px;min-height:64px}
.stk-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.stk-chips .sep{color:var(--muted)}
.stk-list{margin-top:6px}.stk-list .tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
</style>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseIso(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
function fmtDate(s){return parseIso(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function roundPack(q,pack){pack=pack||1;return Math.ceil(q/pack)*pack}

}

/* Part pictures drawn by Claude from catalog sizes. Side view, true proportions, shaded to look like metal.
   Units are mm. 1 mm = PX px. Ground (implant platform or seat) at y = BASE. */
var PA_PX=9.5,PA_W=120,PA_H=170,PA_BASE=150,PA_SEQ=0;
/* Set the ground line so the part from yMin to yMax sits centered above the scale bar. */
function paFit(yMin,yMax){var room=PA_H-26,hgt=(yMax-yMin)*PA_PX;PA_BASE=PA_H-22-Math.max(0,(room-hgt)/2)+yMin*PA_PX}
var PA_COL={ti:['#6f747b','#e9edf1','#9aa1a8','#c9ced4','#5e636a'],tig:['#80858b','#dfe2e5','#a7abb0','#c7cacd','#73787e'],dark:['#1e2023','#5d6268','#2c2f33','#44484d','#17191b'],gold:['#8a6d12','#f4e27a','#b9952a','#e2c955','#7a5f0e'],peek:['#b9b2a6','#f6f2ea','#d4cdc1','#e8e3da','#aaa397']};
function paGrad(id,c){return '<linearGradient id="'+id+'" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="'+c[0]+'"/><stop offset=".32" stop-color="'+c[1]+'"/><stop offset=".55" stop-color="'+c[2]+'"/><stop offset=".8" stop-color="'+c[3]+'"/><stop offset="1" stop-color="'+c[4]+'"/></linearGradient>'}
function paX(r){return PA_W/2+r*PA_PX}
function paY(y){return PA_BASE-y*PA_PX}
/* A turned part: list of [y, r] from bottom to top. Draws the outline and an edge line at every corner. */
function paTurned(st,fill,edge){
  var L=[],R=[],i,h='';
  for(i=0;i<st.length;i++){L.push(paX(-st[i][1]).toFixed(1)+','+paY(st[i][0]).toFixed(1));R.unshift(paX(st[i][1]).toFixed(1)+','+paY(st[i][0]).toFixed(1))}
  h+='<polygon points="'+L.concat(R).join(' ')+'" fill="url(#'+fill+')" stroke="#3b3f44" stroke-width=".7" stroke-linejoin="round"/>';
  for(i=1;i<st.length-1;i++){var a=st[i],b=st[i-1],c=st[i+1];if(Math.abs(a[1]-b[1])>0.05||Math.abs(a[1]-c[1])>0.05)h+='<line x1="'+paX(-a[1]).toFixed(1)+'" x2="'+paX(a[1]).toFixed(1)+'" y1="'+paY(a[0]).toFixed(1)+'" y2="'+paY(a[0]).toFixed(1)+'" stroke="'+(edge||'rgba(40,44,48,.45)')+'" stroke-width=".6"/>'}
  return h;
}
/* Screw thread between y0 and y1 at radius r */
function paThread(y0,y1,r,fill,pitch){
  pitch=pitch||0.4;var h=paTurned([[y0,r*0.8],[y0+0.2,r],[y1,r],[y1,r*0.85]],fill),d='';
  for(var y=y0+0.3;y<y1-0.1;y+=pitch)d+='M'+paX(-r).toFixed(1)+' '+paY(y).toFixed(1)+' L'+paX(r).toFixed(1)+' '+paY(y+pitch*0.6).toFixed(1)+' ';
  return h+'<path d="'+d+'" stroke="rgba(25,28,31,.55)" stroke-width=".8" fill="none"/>';
}
/* A hole drawn the way technical drawings show it: a thin outline of the opening and dashed hidden lines down the channel. d = depth in mm. */
function paHole(y,r,d){var cx=PA_W/2,yy=paY(y),rx=r*PA_PX,ry=Math.max(1.2,rx*0.28),h='';if(d){var y2=paY(y-d).toFixed(1);h+='<path d="M'+(cx-rx).toFixed(1)+' '+yy.toFixed(1)+' V'+y2+' M'+(cx+rx).toFixed(1)+' '+yy.toFixed(1)+' V'+y2+'" stroke="rgba(30,34,38,.55)" stroke-width=".7" stroke-dasharray="2.2 1.8" fill="none"/>'}return h+'<ellipse cx="'+cx+'" cy="'+yy.toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+'" fill="rgba(30,34,38,.10)" stroke="rgba(30,34,38,.6)" stroke-width=".7"/>'}
function paScale(){var x0=8,y=PA_H-8;return '<g stroke="#868b92" stroke-width="1"><line x1="'+x0+'" x2="'+(x0+5*PA_PX)+'" y1="'+y+'" y2="'+y+'"/><line x1="'+x0+'" x2="'+x0+'" y1="'+(y-3)+'" y2="'+(y+3)+'"/><line x1="'+(x0+5*PA_PX)+'" x2="'+(x0+5*PA_PX)+'" y1="'+(y-3)+'" y2="'+(y+3)+'"/></g><text x="'+(x0+5*PA_PX/2)+'" y="'+(y-4)+'" font-size="8" text-anchor="middle" fill="#868b92">5 mm</text>'}
function paSvg(inner,cols,label){
  var id='pa'+(++PA_SEQ),defs='',k;cols=cols||['ti'];
  for(k=0;k<cols.length;k++)defs+=paGrad(id+cols[k],PA_COL[cols[k]]);
  inner=inner.replace(/url\(#G:([a-z]+)\)/g,function(m,c){return 'url(#'+id+c+')'});
  return '<svg viewBox="0 0 '+PA_W+' '+PA_H+'" role="img" aria-label="'+(label||'')+'"><defs>'+defs+'</defs>'+inner+paScale()+(PA_PX>12?'<text x="6" y="13" font-size="9" font-weight="700" fill="#b06a00">2\u00d7 size</text>':'')+'</svg>';

/* Multi-unit cone top, sitting on a shoulder at height y. 4.8 mm across the shoulder. */
function paMuaTop(y,fill){
  return paTurned([[y,2.4],[y+0.35,2.4],[y+0.45,2.15],[y+1.9,1.55],[y+2.05,1.35]],fill)+paHole(y+2.05,0.65,3.2);

function paArtMua(ang,gh){

  h+='<line x1="'+paX(-1.15)+'" x2="'+paX(1.15)+'" y1="'+paY(-0.45)+'" y2="'+paY(-0.45)+'" stroke="rgba(40,44,48,.45)" stroke-width=".6"/>';
  var cx=PA_W/2,cy=paY(top);
  h+='<g transform="rotate('+ang+' '+cx+' '+cy+')">'+paTurned([[top-0.6,2.05],[top,2.3]],'G:ti')+paMuaTop(top,'G:ti')+'</g>';

function paArtTibase(chim,col){
  chim=chim||6;var h='',c=col||'tig';paFit(0,0.3+chim);
  h+=paTurned([[0,2.45],[0.3,2.5],[0.32,2.35],[1.0,2.25],[2.0,2.0],[2.4,1.95],[2.45,1.78],[0.3+chim,1.78],[0.3+chim,1.55]],'G:'+c);

    h+=paTurned([[0,1.9],[0.5,2.4],[1.3,2.6],[1.8,2.2],[2.6,2.6],[3.4,2.2],[4.2,2.6],[5.0,2.2],[5.8,2.6],[6.6,2.4]],'G:ti');

  h+='<rect x="'+paX(1.15).toFixed(1)+'" y="'+paY(5.6).toFixed(1)+'" width="'+(0.85*PA_PX).toFixed(1)+'" height="'+(5*PA_PX).toFixed(1)+'" fill="rgba(255,255,255,.35)"/>';

function paArtScrew(kind,dark){
  var h='',f=dark?'G:dark':'G:ti';paFit(0,4.8);

/* Pick the picture for a part. Returns '' when there is no drawing for it. */
function partArt(p){
  var t=p.type,mu=p.level==='mua',pn=p.pn||'',gold=p.maker==='dess'&&/DESS 3[67]\./.test(pn);
  if(t==='mua'){var md=muaDims(p);return paArtMua(md[0],md[1]||2)}
  if(t==='tibase'){
    if(mu){var ch=/15\.007\/8/.test(pn)?8:6;return paArtTibase(ch,gold?'gold':'tig')}
    var cm=(p.k||'').match(/^tb-[en]-([\d.]+)/);return paArtTibaseImp(cm?+cm[1]:1,!isNonEngP(p),gold?'gold':'tig')
  }
  if(t==='analog'){var k=akind(p)==='s'?'stone':'digital';return mu?paArtAnalog(k):paArtAnalogImp(k)}
  if(t==='screw'){
    var sk=p.k||'',dark=/19\.306|Badger/i.test(pn+' '+(p.v||''));
    if(sk==='sc-a')return paArtScrewK('abut');
    if(sk==='sc-fa'||sk==='sc-ell')return paArtScrewK('flat');
    if(sk==='sc-pa'||sk==='sc-bdg')return paArtScrewK('ball',dark);
    if(sk==='sc-018')return paArtScrewK('long');
    return paArtScrewK('pros');
  }
  if(t==='scanbody')return paArtScanbody(mu);
  if(t==='healcap')return paArtHealcap();
  if(t==='tempcyl')return paArtTempcyl();
  if(t==='attach')return paArtAttach();
  return '';
}

function stockFiltered(){
  var q=UI.stockQ.trim().toLowerCase();
  return S.parts.filter(function(p){
    if(UI.stockBrand!=='all'&&(UI.stockBrand==='dess'?p.maker!=='dess':p.brand!==UI.stockBrand))return false;
    if(UI.stockType&&UI.stockType!=='all'&&p.type!==UI.stockType)return false;
    if(UI.stockSys&&UI.stockSys!=='all'&&p.sys!==UI.stockSys)return false;
    var st=status(p).k;
    if(UI.stockStatus==='stocked'&&!p.stocked)return false;
    if(UI.stockStatus==='low'&&!(st==='low'||st==='out'))return false;
    if(UI.stockStatus==='out'&&st!=='out')return false;
    if(UI.stockStatus==='ask'&&!(p.stocked&&isAsk(p)))return false;
    if(UI.stockStatus==='none'&&p.stocked)return false;
    if(q){var hay=(partName(p)+' '+ctx(p)+' '+p.pn+' '+(p.bin||'')+' '+locText(p)+' '+exoFor(p).map(function(e){return e.n}).join(' ')).toLowerCase();
      /* part numbers match with or without dots, spaces, dashes or slashes: 15007, 15.007, dess15.007 */
      var qz=q.replace(/[\s.\-\/]/g,''),pz=String(p.pn||'').toLowerCase().replace(/[\s.\-\/]/g,'');
      if(hay.indexOf(q)<0&&!(qz.length>=3&&pz.indexOf(qz)>=0))return false}
    return true;
  }).sort(function(a,b){
    function key(p){if(p.loc==='bin'){var m=p.bin.match(/([A-Z])(\d+)/);return '0'+m[1]+pad(+m[2])}return (p.stocked?(p.loc==='maya'?'1':'2'):'3')+p.brand+p.sys+p.plat+p.k}
    return key(a)<key(b)?-1:1;
  });
}

/* ---------- Usage math ---------- */
function monthKey(s){return s.slice(0,7)}
function rangeMonths(r){
  var out=[],y=TODAY.getFullYear(),m=TODAY.getMonth();
  if(r==='12m'){for(var i=11;i>=0;i--){var d=new Date(y,m-i,1);out.push(d)}}
  else if(r==='thisYear'){for(var j=0;j<=m;j++)out.push(new Date(y,j,1))}
  else {for(var k=0;k<12;k++)out.push(new Date(y-1,k,1))}
  return out;
}
function usage(opts){
  var months=rangeMonths(opts.range), keys=months.map(function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}), idx={};
  keys.forEach(function(k,i){idx[k]=i});
  var vals=keys.map(function(){return 0}), byPart={}, cases={}, total=0, cost=0;
  S.pulls.forEach(function(x){
    var i=idx[monthKey(x.d)];if(i==null)return;
    var p=partById(x.p);if(!p)return;
    if(opts.brand&&opts.brand!=='all'&&(opts.brand==='dess'?p.maker!=='dess':p.brand!==opts.brand))return;
    if(opts.part&&opts.part!=='all'&&p.id!==opts.part)return;
    vals[i]+=x.q;total+=x.q;cost+=x.q*p.cost;byPart[p.id]=(byPart[p.id]||0)+x.q;cases[x.pt]=1;
  });
  (S.returns||[]).forEach(function(t){
    if(t.status!=='back')return;var i=idx[monthKey(t.d)];if(i==null)return;var p=partById(t.p);if(!p)return;
    if(opts.brand&&opts.brand!=='all'&&(opts.brand==='dess'?p.maker!=='dess':p.brand!==opts.brand))return;
    if(opts.part&&opts.part!=='all'&&p.id!==opts.part)return;
    vals[i]-=t.q;total-=t.q;cost-=t.q*p.cost;byPart[p.id]=(byPart[p.id]||0)-t.q;
  });
  return{months:months,vals:vals,byPart:byPart,total:total,cost:cost,cases:Object.keys(cases).length};
}
function barChart(vals,labels,label,partialLast){
  var W=760,H=230,pb=28,pt=24,pl=6,n=vals.length,max=Math.max.apply(null,[1].concat(vals)),bw=(W-pl*2)/n;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">';
  vals.forEach(function(v,i){
    var hh=(H-pb-pt)*v/max, x=pl+i*bw+bw*.17, w=bw*.66, y=H-pb-hh;
    s+='<rect class="bar'+(partialLast&&i===n-1?' cur':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(hh,v?1:0).toFixed(1)+'" rx="2"><title>'+labels[i]+': '+v+'</title></rect>';
    if(v)s+='<text class="bv" x="'+(x+w/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'">'+v+'</text>';
    s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'">'+labels[i]+'</text>';
  });
  return s+'</svg>';
}

function docMatches(name){
  var t=String(name||'').toLowerCase().replace(/\bdr\.?\s*/g,'').replace(/[^a-z'&\/ ]/g,' ').replace(/\s+/g,' ').trim();if(!t)return [];
  var words=t.split(' ');
  var exact=DOCS.filter(function(d){return d.n.toLowerCase()===t});if(exact.length)return exact;
  return DOCS.filter(function(d){
    var base=d.n.toLowerCase(),first=(base.match(/\(([^)]+)\)/)||[])[1],keys=base.replace(/\(.*\)/,'').split('/').map(function(x){return x.trim()}).filter(Boolean);
    var hit=keys.some(function(k){return k.indexOf(' ')>=0?t.indexOf(k)>=0:words.indexOf(k)>=0});
    if(!hit)return false;
    if(first&&words.length>1&&words.indexOf(first.split(' ')[0])<0)return false;
    return true;
  });
}
function prefScrewKey(t){t=(t||'').toLowerCase();if(/badger/.test(t))return 'sc-bdg';if(/full arch/.test(t))return 'sc-fa';if(/unigrip/.test(t))return 'sc-p';if(/hex 3i|\.048/.test(t))return 'sc-h048';if(/\.050/.test(t))return 'sc-h050';if(/rosen/.test(t))return 'sc-rosen';if(/prh/.test(t))return 'sc-sinprh';if(/powerball/.test(t))return 'sc-pb';if(/19\.018/.test(t))return 'sc-018';if(/vortex/.test(t))return 'sc-vortex';return null}

/* Screw fit rules. DESS lists its multi-unit RP screws (19.006 and others) as fitting the 4.8 mm multi-unit top of these systems. */
var RP_TOP={'nobel-mua':1,'zv-lpa':1,'bsb-mua':1,'bh-mua':1,'hio-mua':1,'neo-mini':1,'noris-mua':1};
var SRA_EXTRA={'sc-fa':1}; /* DESS lists 19.069 as also fitting the 4.6 mm SRA top */
var SYS_SCREW={'str-sra':{bar:'sc-sra',why:'Straumann SRA bars use the Straumann bar screw, 19.098.'}};
var ATTACH_LABEL={tibase:'Ti-base',direct:'Direct to MUA',bar:'Bar'};
var PREF_MAKER={'sc-p':'dess'}; /* "DESS Unigrip" means DESS 19.006, not any straight screw */
function fitScrew(key,sys,plat){
  if(!key||!sys)return null;
  var mk=PREF_MAKER[key],own=S.parts.filter(function(p){return p.sys===sys&&p.plat===plat&&p.k===key&&(!mk||p.maker===mk)}).sort(function(a,b){return b.stocked-a.stocked})[0];if(own)return own;
  var rp=S.parts.filter(function(p){return p.k===key&&p.sys==='nobel-mua'&&p.plat==='Regular'}).sort(function(a,b){return ((b.maker==='dess')-(a.maker==='dess'))||(b.stocked-a.stocked)})[0];
  if(rp&&(RP_TOP[sys]||(sys==='str-sra'&&SRA_EXTRA[key])))return rp;
  return null;
}
/* Lab defaults when the doctor has no preference: DESS Unigrip 19.006 for a final, Badger for a prototype */
var DEFAULT_SCREW={final:'sc-p',proto:'sc-bdg'};
function defScrew(r,why){
  var sd=SYS_SCREW[r.sys]&&r.attach==='bar'?SYS_SCREW[r.sys]:null,sp=sd?fitScrew(sd.bar,r.sys,r.plat):null;
  if(sp)return {part:sp,why:'system',sysWhy:sd.why};
  var dp=fitScrew(DEFAULT_SCREW[UI.rx.step==='proto'?'proto':'final'],r.sys,r.plat);
  return dp?{part:dp,why:why}:{part:null,why:'none'};
}
function rxScrew(r){
  if(!UI.rx.doctor)return defScrew(r,'default');
  if(!r.doc)return defScrew(r,'offsheet');
  var d=r.doc,pref=r.attach==='direct'?((d.byBrand&&d.byBrand[r.brand])||d.d||null):(d.b||null);if(!pref&&d.u)pref=d.u;
  if(!pref)return defScrew(r,'blank');
  var sd=SYS_SCREW[r.sys]&&r.attach==='bar'?SYS_SCREW[r.sys]:null,sp=sd?fitScrew(sd.bar,r.sys,r.plat):null;
  var pk=prefScrewKey(pref),pp=fitScrew(pk,r.sys,r.plat);
  if(pp)return {part:pp,pref:pref,why:'doctor'};
  if(pk)return {part:sp,pref:pref,why:sp?'swap':'nofit',sysWhy:sd&&sd.why};
  return {part:sp,pref:pref,why:'notcatalog',sysWhy:sd&&sd.why};
}

function rxSnap(){var X=UI.rx;return {doctor:X.doctor,step:X.step,final:X.final,arch:{max:!!X.arch.max,man:!!X.arch.man},text:X.text,ov:X.ov,ai:X.ai,read:X.read,patient:X.patient}}

function rxRestore(sn){UI.rx.doctor=sn.doctor;UI.rx.step=sn.step;UI.rx.final=sn.final;UI.rx.arch=sn.arch;UI.rx.text=sn.text;UI.rx.ov=sn.ov;UI.rx.ai=sn.ai;UI.rx.read=sn.read;UI.rx.patient=sn.patient}
function rxOutcome(items){return items.map(function(it,i){var r=rxResolve(it,i);return {brand:r.brand||null,level:r.level||null,sys:r.sys||null,plat:r.plat||null,qty:r.qty||null,isys:it.implSys||null,iplat:it.implPlat||null,open:r.missing.slice()}})}
function benchRun(t){
  var sn=rxSnap();rxLoad(t);var got;try{got=rxOutcome(rxParse(UI.rx.text))}finally{rxRestore(sn)}
  var exp=t.expect||[],diffs=[];
  if(got.length!==exp.length)diffs.push('Found '+got.length+(got.length===1?' line':' lines')+', expected '+exp.length+'.');
  var n=Math.min(got.length,exp.length);
  for(var i=0;i<n;i++){['brand','level','sys','plat','qty','isys','iplat'].forEach(function(k){if((k==='isys'||k==='iplat')&&!(k in exp[i]))return;var g=got[i][k],e=exp[i][k];if((g||null)!==(e||null))diffs.push('Line '+(i+1)+' '+({brand:'brand',level:'level',sys:'system',plat:'platform',qty:'quantity',isys:'implant read',iplat:'implant platform read'}[k])+': got '+(g==null?'nothing':g)+', expected '+(e==null?'nothing':e)+'.')})}
  return {pass:!diffs.length,got:got,exp:exp,diffs:diffs};
}
function benchSeed(){
  if(S.tests.length)return;
  RX_EXAMPLES.forEach(function(e,i){var sn=rxSnap();rxLoad(e);var out;try{out=rxOutcome(rxParse(UI.rx.text))}finally{rxRestore(sn)}
    S.tests.push({id:'x'+(i+1),t:e.t,text:e.text,doc:e.doc||'',step:e.step||'none',fin:e.fin||'none',arch:e.arch||{},expect:out.map(function(o){return {brand:o.brand,level:o.level,sys:o.sys,plat:o.plat,qty:o.qty}}),verified:false,by:'App (from the 16 example photos)',d:iso(TODAY)})});
  RX_CHECKS.forEach(function(e,i){S.tests.push({id:'c'+(i+1),t:e.t,text:e.text,doc:'',step:e.step,fin:'none',arch:{},expect:e.expect,verified:false,src:'claude',by:'Claude, from maker catalog facts',d:iso(TODAY)})});
  save();
}

function receive(ids,partialQty){
  var notes=[];
  ids.forEach(function(id){
    var l=S.lines.filter(function(x){return x.id===id})[0];if(!l||l.status!=='ordered')return;
    var p=partById(l.partId);
    if(partialQty!=null&&partialQty<l.qty){
      if(partialQty<=0){notes.push('Enter how many arrived.');return}
      S.lines.push({id:nextId('l'),partId:l.partId,qty:l.qty-partialQty,reason:l.reason,reqId:l.reqId||null,patient:l.patient||'',status:'ordered',orderedAt:l.orderedAt,partial:true});
      notes.push('Partial: '+partialQty+' of '+l.qty+' arrived. The other '+(l.qty-partialQty)+((l.qty-partialQty)===1?' stays':' stay')+' on order.');l.qty=partialQty;
    }
    l.status='received';l.receivedAt=iso(TODAY);
    if(l.reason==='request'){var still=S.lines.some(function(x){return x.reqId===l.reqId&&x.status==='ordered'});if(!still)S.requests.forEach(function(r){if(r.id===l.reqId)r.status='received'});var dz=S.requests.filter(function(r){return r.id===l.reqId})[0];notes.push('Hold '+partName(p).toLowerCase()+' for patient '+l.patient+'.'+(dz&&dz.design?' This was a design change. Tell the designer the part is here.':''))}
    else {p.onHand+=l.qty;notes.push('Put '+l.qty+' in '+locText(p)+'.')}
  });
  save();render();toast(notes.join(' '));
}
