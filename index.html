        ${isLead() && !done && !c.hold ? `<button class="btn" onclick="openModal({type:'hold', cid:'${c.id}'})">⏸ Hold</button>`:''}
        <button class="btn" onclick="openModal({type:'ticket', cid:'${c.id}'})">⎙ Work ticket</button>
        ${isLead() && !done ? `<button class="btn danger" onclick="voidCase('${c.id}')">🗑 Void</button>`:''}
      </div>
      <div class="card"><h3>Production flow</h3><div class="track">${trackHtml(c,'main')}</div></div>
      <div class="card"><h3>💬 Case chat — follows the case</h3>
        ${chatHtml(c)}
      </div>
      <div class="card"><h3>Activity</h3>
        ${c.events.slice().reverse().map(e=>`<div class="evt ${e.type==='moveback'||e.type==='warn'?'warn':''}">${e.type==='moveback'?'↩ ':''}${esc(e.text)} <span class="t">· ${esc(e.who)} · ${fmtWhen(new Date(e.when))}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ===================== bench ===================== */
function vBench(){
  const t = tech(state.benchTechId);
  const my = techOpenSteps(t.id);
  const c = state.benchCaseId ? getCase(state.benchCaseId) : null;
  const myNudges = CASES.filter(cc=>!caseDone(cc)).flatMap(cc=>cc.nudges.map((n,ni)=>({c:cc,n,ni})).filter(x=>x.n.toDept===t.dept));
  let stepCard='';
  if(c && c.hold && !caseDone(c)){
    stepCard = `<div class="bench-step" style="border-color:var(--serious);">
      <div class="big-case">${c.id} · ${esc(c.patient)} · ${wfOf(c).name}</div>
      <div class="big-name" style="font-size:18px;">⏸ On hold — don't start</div>
      <div class="assign-hint" style="margin-top:8px; text-align:left; border:1px solid var(--serious);"><b>${esc(c.hold.by)}:</b> ${esc(c.hold.reason)}<br>See a lead before any work happens on this case.</div>
      <div class="btnrow" style="margin-top:12px;">
        <button class="btn" onclick="openModal({type:'chat', cid:'${c.id}', bench:true})">💬 Chat</button>
        <button class="btn" onclick="openCase('${c.id}')">Details</button>
        ${isLead()? `<button class="btn primary" onclick="releaseHold('${c.id}')">Release hold</button>`:''}
      </div>
    </div>
    <div class="btnrow" style="margin-top:10px;"><button class="btn" onclick="state.benchCaseId=null; state.benchSel=null; render();">← Back to my list</button></div>`;
  }
  else if(c && !state.benchSel){
    const cs=currentSteps(c);
    const myGated = cs.find(s=>s.def.d===t.dept && s.blocked);
    const myAppr = cs.find(s=>s.def.d===t.dept && s.def.approval);
    const headline = !cs.length ? 'Case complete ✓'
      : myGated ? '⛔ Gated — waiting on night guard'
      : myAppr ? '⏳ Waiting on doctor approval'
      : 'Nothing here for '+t.dept;
    const explain = !cs.length ? ''
      : myGated ? `<b>${esc(myGated.def.n)}</b> is yours, but it can't start until the night-guard track finishes. It'll appear in your list the moment it unlocks.`
      : myAppr ? `<b>${esc(myAppr.def.n)}</b> is waiting on ${esc(c.doctor)} — nothing to do at the bench until the approval is recorded.`
      : `This case isn't at a ${t.dept} step, so there's nothing to check in here.`;
    stepCard = `<div class="bench-step">
      <div class="big-case">${c.id} · ${esc(c.patient)} · ${wfOf(c).name}</div>
      <div class="big-name" style="font-size:17px;">${headline}</div>
      ${cs.length? `<div class="assign-hint" style="margin-top:8px; text-align:left;">Current step${cs.length>1?'s':''}: ${cs.map(s=>`<b>${esc(s.def.n)}</b> (${s.def.d}${s.st.assignee?' · '+tech(s.st.assignee).name:''})${s.def.approval?' · ⏳ waiting on doctor':''}${s.blocked?' · gated':''}`).join(' + ')}.<br>${explain}</div>`:''}
      <div class="btnrow" style="margin-top:12px;">
        <button class="btn" onclick="openCase('${c.id}')">Details</button>
        <button class="btn" onclick="openModal({type:'chat', cid:'${c.id}', bench:true})">💬 Chat</button>
        <button class="btn" onclick="openModal({type:'flag', cid:'${c.id}', bench:true})">⚑ Flag for lead</button>
      </div>
    </div>
    <div class="btnrow" style="margin-top:10px;"><button class="btn" onclick="state.benchCaseId=null; state.benchSel=null; render();">← Back to my list</button></div>`;
  }
  else if(c && state.benchSel){
    const {track, idx} = state.benchSel;
    const def = stepDefs(c,track)[idx];
    const st = c.tracks[track].steps[idx];
    const cur = trackIdx(c,track)===idx;
    const blocked = cur && isBlocked(c,track,idx);
    const waiting = !cur;
    stepCard = `<div class="bench-step">
      <div class="big-case">${c.id} · ${esc(c.patient)} · ${wfOf(c).name} ${track==='ng'?'<span class="badge b-ng">NG TRACK</span>':''}</div>
      <div class="big-name">${def.n}</div>
      <div class="subtle">${def.d} · ${def.h}h est${dueLabel(c, track, idx, st)} ${st.assignee? '· assigned to '+tech(st.assignee).name : '· unassigned'}</div>
      ${stepLate(c, track, idx)? '<div class="assign-hint" style="margin-top:8px; border:1px solid var(--critical); color:var(--critical); background:none;"><b>Behind schedule</b> — this step\'s target date has passed.</div>':''}
      ${waiting? `<div class="assign-hint" style="margin-top:8px;">⏳ Earlier steps aren’t done yet — this step isn’t up next.</div>`:''}
      ${blocked? `<div class="assign-hint" style="margin-top:8px;">⛔ Gated — night-guard track must finish first.</div>`:''}
      ${(()=>{
        const mine = st.assignee===state.benchTechId;
        const otherWorking = st.status==='in' && st.assignee && !mine;
        const otherQueued = st.status==='todo' && st.assignee && !mine;
        if(otherWorking) return `<div class="assign-hint" style="margin-top:8px;">✋ <b>${tech(st.assignee).name}</b> is checked in on this step right now. Don't touch it unless you're actually taking it over.</div>
          <div class="btnrow" style="margin-top:10px;"><button class="btn danger" onclick="benchCheckIn('${c.id}','${track}',${idx})">⇄ Take over from ${tech(st.assignee).name}</button></div>`;
        return `
          ${otherQueued? `<div class="assign-hint" style="margin-top:8px;">Assigned to <b>${tech(st.assignee).name}</b> — checking in reassigns it to you (logged).</div>`:''}
          <div class="btnrow" style="margin-top:14px;">
            ${st.status==='todo' && cur? `<button class="btn primary big" ${blocked?'disabled':''} onclick="benchCheckIn('${c.id}','${track}',${idx})">▣ Check in (scan)</button>` : ''}
            ${st.status==='in' && cur? `<button class="btn primary big" ${blocked?'disabled':''} onclick="benchComplete('${c.id}','${track}',${idx})">✓ Complete step</button>` : ''}
          </div>`;
      })()}
      <div class="btnrow">
        ${st.status==='todo' && st.assignee===state.benchTechId? `<button class="btn" onclick="returnToQueue('${c.id}','${track}',${idx})">↥ Return to queue</button>`:''}
        ${st.status==='in' && cur && st.assignee===state.benchTechId? `<button class="btn" onclick="benchUndoCheckIn('${c.id}','${track}',${idx})">⎌ Undo check-in</button>`:''}
        <button class="btn" onclick="openModal({type:'chat', cid:'${c.id}', bench:true})">💬 Chat</button>
        <button class="btn" onclick="openModal({type:'flag', cid:'${c.id}', bench:true})">⚑ Flag for lead</button>
        <button class="btn" onclick="openCase('${c.id}')">Details</button>
      </div>
      ${c.notes.length? `<div style="text-align:left; margin-top:8px;"><div class="track-title">💬 Latest chat</div>${c.notes.slice(-2).reverse().map(n=>`<div class="note"><div class="who">${esc(n.who)} · ${fmtWhen(new Date(n.when))}${n.ping?' · 👉 '+esc(n.ping):''}</div>${esc(n.text)}</div>`).join('')}</div>`:''}
      ${(()=>{ const ln=linkedNotes(c); return ln? `<div style="text-align:left; margin-top:8px;"><div class="track-title">⧉ From linked ${ln.id}</div>${ln.notes.map(n=>`<div class="note"><div class="who">${esc(n.who)} · ${fmtWhen(new Date(n.when))}</div>${esc(n.text)}</div>`).join('')}</div>`:''; })()}
    </div>
    <div class="btnrow" style="margin-top:10px;"><button class="btn" onclick="state.benchCaseId=null; state.benchSel=null; render();">← Back to my list</button></div>`;
  }
  return `
    <h2 class="pagetitle">My bench <span class="subtle">— scan-first</span></h2>
    <div class="searchrow">
      <select class="field" onchange="state.benchTechId=this.value; if(state.role==='tech') state.userId=this.value; state.benchCaseId=null; state.benchSel=null; state.benchMsg=null; render();">
        ${TECHS.filter(BENCHABLE).map(x=>`<option value="${x.id}" ${x.id===state.benchTechId?'selected':''}>Signed in as: ${x.name} — ${x.dept}</option>`).join('')}
      </select>
    </div>
    ${myNudges.length? myNudges.map(x=>`<div class="assign-hint" style="display:flex; gap:8px; align-items:center;"><span style="flex:1;">👉 <b>${x.c.id}</b> ${esc(x.n.from)}: ${esc(x.n.text)}</span><button class="linklike" onclick="dismissNudge('${x.c.id}',${x.ni})">✕</button></div>`).join(''):''}
    ${state.benchMsg? `<div class="assign-hint" style="border:1px solid var(--good); background:none; color:var(--good-text);">${state.benchMsg}</div>`:''}
    ${c? stepCard : `
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <div class="seg">
          <button class="${state.benchView==='list'?'on':''}" onclick="state.benchView='list'; render();">▤ List</button>
          <button class="${state.benchView==='board'?'on':''}" onclick="state.benchView='board'; render();">▦ Board</button>
        </div>
        ${state.benchView==='board'? `<div class="seg">
          <button class="${state.benchGroup==='day'?'on':''}" onclick="state.benchGroup='day'; render();">By day</button>
          <button class="${state.benchGroup==='type'?'on':''}" onclick="state.benchGroup='type'; render();">By case type</button>
          <button class="${state.benchGroup==='status'?'on':''}" onclick="state.benchGroup='status'; render();">By status</button>
        </div>`:''}
      </div>
      ${state.benchView==='board' ? benchBoard(my) : `
      <div class="card">
        <h3>My work (${my.length} step${my.length===1?'':'s'} · ${my.reduce((a,r)=>a+r.def.h,0).toFixed(1)}h est)</h3>
        ${my.length? my.map(r=>`
          <div class="my-row" onclick="benchWork('${r.c.id}','${r.track}',${r.idx})">
            <div class="cid" style="border-left:4px solid ${WF_COLORS[r.c.wf]}; padding-left:6px;">${r.c.id}</div>
            <div class="cmeta" style="flex:1; min-width:0;">
              <div class="l1" style="font-size:12.5px;">${esc(r.def.n)} ${r.def.d!==r.def.n?`<span class="dept-chip">${r.def.d}</span>`:''} ${r.track==='ng'?'<span class="badge b-ng">NG</span>':''} ${r.c.rush?'<span class="badge b-rush">RUSH</span>':''} ${r.blocked?'🔒':''}</div>
              <div class="l2">${esc(r.c.patient)} · ${r.def.h}h est${r.current? dueLabel(r.c, r.track, r.idx, r.st):''} ${r.current?'':'· not up yet'}</div>
            </div>
            <span class="st ${r.st.status==='in'?'in':''}">${r.st.status==='in'?'WORKING':'QUEUED'}</span>
            <div class="ship">${shipLabel(r.c)}</div>
          </div>`).join('') : '<div class="empty">Nothing assigned to you. Scan a ticket below or ask your lead.</div>'}
      </div>`}
      <div class="scanbox" onclick="openModal({type:'scan'})">
        <span class="ic">▮▍▮▍▮</span>
        Scan a work ticket<br><span class="subtle">(tap to simulate scanning a barcode)</span>
        <div style="margin-top:8px;">${pearlSvg('happy',34)}</div>
      </div>`}
  `;
}
function benchBoard(my){
  let cols=[];
  if(state.benchGroup==='day'){
    const buckets=[['Overdue',r=>dayDiff(new Date(r.c.ship))<0],['Today',r=>dayDiff(new Date(r.c.ship))===0],['Tomorrow',r=>dayDiff(new Date(r.c.ship))===1],['This week',r=>{const d=dayDiff(new Date(r.c.ship)); return d>=2&&d<=6;}],['Later',r=>dayDiff(new Date(r.c.ship))>6]];
    cols = buckets.map(([t,f])=>({title:t, cards:my.filter(f)})).filter(x=>x.cards.length||['Today','Tomorrow'].includes(x.title));
  } else if(state.benchGroup==='type'){
    cols = Object.entries(WORKFLOWS).map(([k,w])=>({title:w.name, cards:my.filter(r=>r.c.wf===k)})).filter(x=>x.cards.length);
  } else {
    cols = [
      {title:'Working', cards:my.filter(r=>r.st.status==='in')},
      {title:'Queued', cards:my.filter(r=>r.st.status==='todo' && r.current && !r.blocked)},
      {title:'Waiting / gated', cards:my.filter(r=>r.st.status==='todo' && (!r.current || r.blocked))},
    ];
  }
  if(!my.length) return '<div class="card"><div class="empty">Nothing assigned to you. Scan a ticket below or ask your lead.</div></div>';
  return `<div class="kb" style="margin-top:10px;">
    ${cols.map(col=>`
      <div class="kb-col">
        <h4>${col.title} <span>${col.cards.length}</span></h4>
        ${col.cards.map(r=>`
          <div class="kb-card" style="border-left-color:${WF_COLORS[r.c.wf]}" onclick="benchWork('${r.c.id}','${r.track}',${r.idx})">
            <div class="kc-top">${r.c.id} ${r.track==='ng'?'<span class="badge b-ng">NG</span>':''} ${r.c.rush?'<span class="badge b-rush">RUSH</span>':''} ${r.blocked?'🔒':''}</div>
            <div class="kc-step">${esc(r.def.n)} · ${esc(r.c.patient)}</div>
            <div class="kc-bot"><span>${r.st.status==='in'?'WORKING':(r.current?'queued':'not up yet')}</span><span>${shipLabel(r.c)}</span></div>
          </div>`).join('') || '<div class="empty" style="padding:6px 0;">—</div>'}
      </div>`).join('')}
  </div>`;
}

/* ===================== modals ===================== */
function vModal(){
  const m = state.modal; if(!m) return '';
  const c = m.cid? getCase(m.cid): null;
  let body='';
  if(m.type==='scan'){
    body = `<h3>Scan ticket — pick a case</h3>
      ${CASES.filter(x=>!caseDone(x)).map(x=>`<button class="opt-row" onclick="benchPick('${x.id}')"><b>${x.id}</b> · ${esc(x.patient)} <span class="subtle">${wfOf(x).name} · ${esc(currentLabel(x))}</span></button>`).join('')}`;
  }
  if(m.type==='person'){
    const t = tech(m.tid);
    const rows = techOpenSteps(m.tid);
    body = `<h3>${t.name} — ${t.dept} · ${rows.reduce((a,r)=>a+r.def.h,0).toFixed(1)}h open</h3>
      ${rows.length? rows.map(r=>`
        <div class="my-row" style="cursor:default;">
          <div class="cid">${r.c.id}</div>
          <div class="cmeta" style="flex:1; min-width:0;">
            <div class="l1" style="font-size:12.5px;">${esc(r.def.n)} <span class="dept-chip">${r.def.d}</span> ${r.track==='ng'?'<span class="badge b-ng">NG</span>':''}</div>
            <div class="l2">${esc(r.c.patient)} · ${r.def.h}h · ${shipLabel(r.c)} · ${r.st.status==='in'?'working now':'queued'}</div>
          </div>
          <button class="linklike" onclick="closeModal(); openCase('${r.c.id}')">open</button>
          ${isLead() ? `<button class="linklike" onclick="unassignStep('${r.c.id}','${r.track}',${r.idx},'${m.tid}')">unassign</button>`:''}
        </div>`).join('') : '<div class="empty">No open steps.</div>'}
      <div class="btnrow"><button class="btn" onclick="closeModal()">Close</button></div>`;
  }
  if(m.type==='kbcard'){
    const defs = stepDefs(c, m.track);
    const def = defs[m.idx];
    const st = c.tracks[m.track].steps[m.idx];
    const blocked = isBlocked(c, m.track, m.idx);
    const next = m.idx+1 < defs.length ? defs[m.idx+1] : null;
    body = `<h3>${c.id} · ${esc(def.n)} ${m.track==='ng'?'(NG track)':''}</h3>
      <div class="subtle" style="margin-bottom:8px;">${esc(c.patient)} · ${wfOf(c).name} · ${st.assignee? 'assigned to '+tech(st.assignee).name : 'unassigned'} · ${shipLabel(c)}</div>
      ${blocked? '<div class="assign-hint">⛔ Gated — night-guard track must finish before this advances.</div>':''}
      <button class="opt-row" onclick="closeModal(); openCase('${c.id}')">📄 Open case</button>
      ${isLead()? `<button class="opt-row" ${blocked?'disabled':''} onclick="kbAdvance('${c.id}','${m.track}',${m.idx})">${def.approval?'✓ Record doctor approval':'✓ Complete step'}${next? ' → next: '+esc(next.n)+' ('+next.d+')' : ' → track done'}</button>`:''}
      ${isLead() && !def.approval? `<div style="display:flex; gap:6px; margin:6px 0;"><select id="kb-assign" class="field" style="flex:1;"><option value="">${st.assignee? '⇄ reassign…':'＋ assign…'}</option>${assignOptions(def, st.assignee)}</select><button class="btn" onclick="kbAssign('${c.id}','${m.track}',${m.idx})">Assign</button></div>`:''}
      ${isLead() && m.track==='main'? `<button class="opt-row" onclick="openModal({type:'moveback', cid:'${c.id}'})">↩ Move back (reason required)</button>`:''}
      <div class="btnrow"><button class="btn" onclick="closeModal()">Close</button></div>`;
  }
  if(m.type==='team'){
    body = `<h3>👥 Team setup — skills &amp; time off</h3>
      <div class="subtle">Tap a skill chip to cycle: <b>✓ primary</b> → <b>B backup</b> → <b>✕ off</b>. Backups only get a step when every primary is full. Leads are always the last resort: work goes to techs first, leads only when no tech has capacity.</div>
      ${TECHS.filter(BENCHABLE).map(t=>{
        const steps=[...new Set([...deptStepNames(t.dept), ...Object.keys(SKILL_OVERRIDES[t.id]||{})])];
        const abs=techAbsences(t.id);
        return `<div style="border-bottom:1px solid var(--grid); padding:9px 0;">
          <div class="tech-head"><span class="tname">${t.name}</span> <span class="dept-chip">${t.dept}</span>
            ${outToday(t.id)? '<span class="badge b-over">OUT TODAY</span>':''}
            ${!outToday(t.id)? `<button class="linklike" style="margin-left:auto;" onclick="markOut('${t.id}',0,1,'out today')">mark out today</button>`:''}
          </div>
          <div class="filters" style="padding:6px 0 2px;">
            ${steps.map(s=>{
              const lv=stepQual(t,{n:s, d:t.dept});
              return `<button class="fchip ${lv===1?'on':''}" style="${lv===2?'border-color:var(--accent); color:var(--accent);':''} ${lv===0?'opacity:.45;':''}" onclick="cycleSkill('${t.id}','${esc(s)}')">${lv===1?'✓':lv===2?'B':'✕'} ${esc(s)}</button>`;
            }).join('')}
          </div>
          ${abs.length? abs.map(a=>`<div class="subtle">🏖 out ${a.from===0?'now':'in '+a.from+'d'} for ${a.to-a.from+1} day${a.to-a.from?'s':''}${a.note?' · '+esc(a.note):''} <button class="linklike" onclick="removeAbsence(${a.i})">remove</button></div>`).join(''):''}
          <div style="display:flex; gap:6px; align-items:center; margin-top:5px; font-size:12px;">
            <span class="subtle">Time off:</span> starts in <input id="abs-from-${t.id}" type="number" value="1" min="0" style="width:52px; padding:4px;"> d, for
            <input id="abs-days-${t.id}" type="number" value="1" min="1" style="width:52px; padding:4px;"> d
            <button class="linklike" onclick="markOut('${t.id}', +document.getElementById('abs-from-${t.id}').value, +document.getElementById('abs-days-${t.id}').value, 'planned')">add</button>
          </div>
        </div>`;
      }).join('')}
      <div class="btnrow" style="margin-top:10px;"><button class="btn" onclick="closeModal()">Close</button></div>`;
  }
  if(m.type==='hold'){
    body = `<h3>⏸ Hold ${c.id} for special attention</h3>
      <div class="subtle">Held cases stay visible everywhere but are skipped by auto-assign, and the bench can't start them until a lead releases the hold.</div>
      <textarea id="m-text" class="field" rows="2" placeholder="Why does this need eyes first?"></textarea>
      <div class="btnrow"><button class="btn primary" onclick="setHold('${c.id}', document.getElementById('m-text').value.trim())">Hold it</button><button class="btn" onclick="closeModal()">Cancel</button></div>`;
  }
  if(m.type==='chat'){
    body = `<h3>💬 ${c.id} · ${esc(c.patient)}</h3>
      ${chatHtml(c,{bench:m.bench})}
      <div class="btnrow" style="margin-top:10px;"><button class="btn" onclick="closeModal()">Close</button></div>`;
  }
  if(m.type==='flag'){
    body = `<h3>⚑ Flag for lead — ${c.id}</h3>
      <div class="subtle">Case stays where it is; it jumps into the lead inbox with your reason.</div>
      <textarea id="m-text" class="field" rows="3" placeholder="What should the lead look at?"></textarea>
      <div class="btnrow"><button class="btn primary" onclick="saveFlag('${c.id}',${!!m.bench})">Flag it</button><button class="btn" onclick="closeModal()">Cancel</button></div>`;
  }
  if(m.type==='nudge'){
    body = `<h3>👉 Nudge a department — ${c.id}</h3>
      <label class="f">Department</label>
      <select id="m-dept" class="field">${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select>
      <label class="f">Message</label>
      <textarea id="m-text" class="field" rows="2" placeholder="e.g. can you queue this today?"></textarea>
      <div class="btnrow"><button class="btn primary" onclick="saveNudge('${c.id}')">Send nudge</button><button class="btn" onclick="closeModal()">Cancel</button></div>`;
  }
  if(m.type==='moveback'){
    const defs = stepDefs(c,'main');
    const cur = trackIdx(c,'main');
    const opts = defs.map((d,i)=>({d,i})).filter(x=>x.i < (cur===-1?defs.length:cur));
    const preIdx = m.preIdx!==undefined && opts.some(o=>o.i===m.preIdx) ? m.preIdx : (opts.length?opts[opts.length-1].i:0);
    body = opts.length? `<h3>↩ Move back — ${c.id} <span class="subtle">(management only)</span></h3>
      <label class="f">Refabricate from step</label>
      <select id="m-step" class="field">${opts.map(x=>`<option value="${x.i}" ${x.i===preIdx?'selected':''}>${x.d.n} (${x.d.d})</option>`).join('')}</select>

function barcodeHtml(id){
  let bars='';
  for(const ch of id.replace(/[^A-Z0-9]/gi,'')){
    const n = ch.charCodeAt(0);
    for(let b=0;b<4;b++){
      const w = ((n >> b) & 1) ? 3 : 1.5;
      bars += `<i style="width:${w}px; margin-right:${b%2?2:1.5}px;"></i>`;
    }
  }
  return `<div class="barcode">${bars}</div><div class="barcode-num">${id}</div>`;
}
function ticketHtml(c){
  const defs = stepDefs(c,'main');
  const wf = wfOf(c);
  return `<div class="ticket">
    ${barcodeHtml(c.id)}
    <table>
      <tr><td><b>Patient</b></td><td>${esc(c.patient)}</td><td><b>${wf.endState==='ship'?'Ship':'Seat'}</b></td><td>${fmtDate(new Date(c.ship))} ${c.rush?'· RUSH':''}</td></tr>
      <tr><td><b>Doctor</b></td><td>${esc(c.doctor)}</td><td><b>Flow</b></td><td>${wf.name}</td></tr>
      ${c.linkedTo?`<tr><td><b>Linked</b></td><td colspan="3">${c.linkedTo}</td></tr>`:''}
    </table>
    <table class="steps" style="margin-top:8px;">
      ${defs.map((d,i)=>{const st=c.tracks.main.steps[i]; const due=stepDue(c,'main',i); return `<tr><td style="width:18px;"><span class="chk" style="${st.status==='done'?'background:#555;':''}"></span></td><td>${d.n}</td><td>${d.d}</td><td style="font-size:10px; color:#777;">${due?fmtDate(due):''}</td><td style="text-align:right;">${st.status==='done'&&st.assignee?tech(st.assignee).name:''}</td></tr>`;}).join('')}
      ${wf.ng? `<tr><td colspan="4" style="padding-top:6px;"><b>∥ Night guard track</b></td></tr>` + wf.ng.map((d,i)=>{const st=c.tracks.ng?c.tracks.ng.steps[i]:null; return `<tr><td><span class="chk" style="${st&&st.status==='done'?'background:#555;':''}"></span></td><td>${d.n}</td><td>${d.d}</td><td></td></tr>`;}).join(''):''}
    </table>
    ${(()=>{ const ln=linkedNotes(c); return ln? `<div style="font-size:11px; margin-top:8px; border-top:1px solid #eee; padding-top:6px;"><b>⧉ ${ln.id}:</b> ${esc(ln.notes[0].text)} <i>(${esc(ln.notes[0].who)})</i></div>`:''; })()}
    <div style="font-size:10.5px; color:#777; margin-top:8px;">Scan at each bench to check in / out. Notes live in the LMS — scan to read.</div>
  </div>`;

  else if(r==='frontdesk'){ state.userId='t14'; }

let qDrag=null;
function qDragStart(e, cid, track, idx){
  if(!isLead()) return;
  qDrag={cid, track, idx};
  e.target.classList.add('dragging');
}
function qDrop(tid){
  if(!qDrag || !isLead()){ qDrag=null; return; }
  const c=getCase(qDrag.cid);
  const def=stepDefs(c,qDrag.track)[qDrag.idx];
  const st=c.tracks[qDrag.track].steps[qDrag.idx];
  if(trackIdx(c,qDrag.track)!==qDrag.idx || st.assignee){ qDrag=null; state.boardMsg='That queue card was stale — board refreshed.'; render(); return; }
  st.assignee=tid;
  const cross = tech(tid).dept!==def.d;
  const ql = stepQual(tech(tid), def);
  logEvt(c, `${def.n} assigned to ${tech(tid).name} (drag)${cross? ` (⚠ cross-department)`:''}${ql===0?' (⚠ not in their skill set)':''}`, (cross||ql===0)?'warn':'step');
  state.boardMsg=`${cross||ql===0?'⚠':'✓'} ${c.id} · ${def.n} → ${tech(tid).name}${ql===0?' — heads up: not in their skill set':''}${cross&&ql!==0?' — cross-department':''}`;
  state.boardMsgAction = tid===state.userId ? {cid:c.id, track:qDrag.track, idx:qDrag.idx} : null;
  qDrag=null;
  render();
}
function teamTap(tid){

function selQueue(cid, track, idx){

function clearSel(e){ e.preventDefault(); state.boardSel=null; render(); }
function assignSel(tid){

  const c=getCase(s.cid);
  const def=stepDefs(c,s.track)[s.idx];
  c.tracks[s.track].steps[s.idx].assignee=tid;

  state.boardSel=null;
  state.boardMsg = `${cross?'⚠ ':'✓ '}${s.cid} · ${def.n} → ${tech(tid).name}${cross? ` — heads up: step is ${def.d}, ${tech(tid).name.split(' ')[0]} is ${tech(tid).dept}`:''}`;
  state.boardMsgAction = tid===state.userId ? {cid:s.cid, track:s.track, idx:s.idx} : null;   // assigned to yourself → one tap to your bench

function assignOptions(def, currentTid){
  const rank = t => (stepQual(t,def)===1?0:stepQual(t,def)===2?1:2) + (outToday(t.id)?0.5:0);
  return TECHS.filter(BENCHABLE).slice().sort((a,b)=>rank(a)-rank(b) || a.name.localeCompare(b.name))
    .map(t=>`<option value="${t.id}" ${currentTid===t.id?'disabled':''}>${t.name} — ${t.dept}${outToday(t.id)?' · out today':''}${stepQual(t,def)===0?' · ⚠ not skilled':stepQual(t,def)===2?' · backup':''}</option>`).join('');
}
function sheetAssign(cid, track, idx, val){
  if(!val){ return; }
  const c=getCase(cid);
  const st=c.tracks[track].steps[idx];
  const def=stepDefs(c,track)[idx];
  if(val==='__clear__'){
    if(st.assignee) unassignStep(cid, track, idx, st.assignee);
    else render();
    return;
  }
  if(st.status==='in' && st.assignee && st.assignee!==val){
    if(!window.confirm(`${tech(st.assignee).name} is checked in on ${def.n} right now. Hand it to ${tech(val).name} anyway?`)){ render(); return; }
    st.status='todo'; st.start=null;
  }
  const prev=st.assignee;
  st.assignee=val;
  const t=tech(val);
  const warns=[];
  if(t.dept!==def.d) warns.push('cross-department');
  if(stepQual(t,def)===0) warns.push('not in their skill set');
  if(outToday(t.id)) warns.push('marked out today');
  if(c.hold) warns.push('case is on HOLD — they can\'t start it until it\'s released');
  logEvt(c, `${def.n} ${prev? 'reassigned from '+tech(prev).name+' to':'assigned to'} ${t.name} (from case page)${warns.length? ' (⚠ '+warns.join(', ')+')':''}`, warns.length?'warn':'step');
  render();
}
function unassignStep(cid, track, idx, tid){
  const c=getCase(cid);
  const st=c.tracks[track].steps[idx];
  if(st.status==='in'){
    if(!window.confirm(`${tech(tid).name} is checked in on this step right now. Pull them off and send it back to the queue?`)){ render(); return; }
    st.status='todo'; st.start=null;
  }
  st.assignee=null;
  logEvt(c, `${stepDefs(c,track)[idx].n} unassigned from ${tech(tid).name} — back to queue`, 'step');
  render();
}
/* kanban */
let kbDrag=null;
function kbDragStart(cid, track, idx){ kbDrag={cid, track, idx}; }
function kbDrop(dept){
  if(!kbDrag || !isLead()){ kbDrag=null; return; }
  const {cid, track, idx} = kbDrag; kbDrag=null;
  const c=getCase(cid);
  const defs=stepDefs(c,track);
  const cur=trackIdx(c,track);
  state.kbMsg=null;
  if(cur!==idx){ state.kbMsg='That card is stale — board refreshed.'; render(); return; }
  const curDept = defs[idx].d;
  const next = idx+1<defs.length? defs[idx+1] : null;
  const advance = ()=>{
    if(defs[idx].approval){ state.kbMsg=`${defs[idx].n} is a doctor approval — record it from the card menu or the case sheet, not by drag.`; render(); return; }
    if(isBlocked(c,track,idx)){ state.kbMsg=`${c.id} is gated — the night-guard track must finish before ${defs[idx].n} completes.`; render(); return; }
    completeStep(c, track, idx, state.userId);
    if(next) state.kbMsg = `${c.id}: ${defs[idx].n} completed → ${next.n} (${next.d}).`;
    else if(track==='ng') state.kbMsg = `${c.id}: night-guard track complete — main track continues${caseDone(c)?'':' (QC now unlocked)'}.`;
    else state.kbMsg = caseDone(c)? `${c.id}: ${defs[idx].n} completed — ${wfOf(c).endState==='ship'?'shipped':'delivered in-house'}.` : `${c.id}: ${defs[idx].n} completed — waiting on the NG track before the case can close.`;
    if(caseDone(c)) confettiBurst();
    render();
  };
  if(dept==='__DONE__'){
    if(!next){ advance(); } else { state.kbMsg=`${c.id} still has steps left — next is ${next.n} (${next.d}).`; render(); }
    return;
  }
  if(dept===curDept){
    if(next && next.d===curDept){ advance(); }             // same-dept advance: drop on own column
    else { state.kbMsg = next? `Next step for ${c.id} is ${next.n} in ${next.d}.` : `${c.id} is at its last step — drag to Done.`; render(); }
    return;
  }
  if(next && next.d===dept){ advance(); return; }
  if(track==='main'){
    const earlier = defs.map((d,i)=>({d,i})).filter(x=>x.i<idx && x.d.d===dept);
    if(earlier.length){
      openModal({type:'moveback', cid, preIdx:earlier[0].i});
      return;
    }
  }
  state.kbMsg = next? `Next step for ${c.id} is ${next.n} in ${next.d} — drop it there, on its own column, or use the card menu.` : `${c.id} is at its last step — drag to Done.`;
  render();
}
function kbAdvance(cid, track, idx){
  const c=getCase(cid);
  if(trackIdx(c,track)!==idx || isBlocked(c,track,idx)){ closeModal(); return; }
  if(stepDefs(c,track)[idx].approval) logEvt(c, `Doctor approval recorded (${c.doctor}) by ${me().name}`, 'step');
  completeStep(c, track, idx, state.userId);
  closeModal();
}
function kbAssign(cid, track, idx){
  const tid=document.getElementById('kb-assign').value;
  if(!tid){ return; }
  closeModal();
  sheetAssign(cid, track, idx, tid);   // one assignment rulebook everywhere: confirm on mid-work handoff, warnings, honest logs
}

function resolveInbox(cid, kind, ni){
  const c=getCase(cid);
  if(kind==='flag'){ c.flag=null; logEvt(c,'Flag cleared','sys'); }
  else if(ni>=0 && c.nudges[ni]){
    logEvt(c, `Nudge to ${c.nudges[ni].toDept} cleared`, 'sys');

  }

}
function recordApproval(cid, idx){
  const c=getCase(cid);
  if(trackIdx(c,'main')!==idx || !stepDefs(c,'main')[idx].approval) return;
  logEvt(c, `Doctor approval recorded (${c.doctor}) by ${me().name}`, 'step');
  completeStep(c, 'main', idx, state.userId);
  render();
}
function dismissNudge(cid, ni){

/* bench */
function benchWork(cid, track, idx){
  state.benchCaseId=cid; state.benchSel={track, idx}; state.benchMsg=null; render();
}
function benchPick(cid){
  const c=getCase(cid);
  const t=tech(state.benchTechId);
  const cs=currentSteps(c);
  const mine = cs.find(s=>s.def.d===t.dept && !s.blocked && !s.def.approval);
  state.benchCaseId=cid;
  state.benchSel = mine? {track:mine.track, idx:mine.idx} : null;   // null → info card, no work buttons
  state.benchMsg=null;
  closeModal();
}
function benchUndoCheckIn(cid, track, idx){
  const c=getCase(cid);
  const st=c.tracks[track].steps[idx];
  if(st.status==='in'){
    const prev = st.prev || {assignee:null, status:'todo', start:null};
    st.assignee=prev.assignee; st.status=prev.status; st.start=prev.start;   // take-over undone → original tech is WORKING again
    delete st.prev;
    const outcome = !prev.assignee ? ' — returned to unassigned queue'
      : prev.status==='in' ? ` — ${tech(prev.assignee).name} is checked in again, session intact`
      : ` — back with ${tech(prev.assignee).name}`;
    logEvt(c, `${stepDefs(c,track)[idx].n}: check-in undone by ${benchActor()}${outcome}`, 'step', benchActor());
    if(!prev.assignee){ state.benchCaseId=null; state.benchSel=null; state.benchMsg='Check-in undone — case returned to the queue.'; }
  }
  render();
}
function returnToQueue(cid, track, idx){
  const c=getCase(cid);
  const st=c.tracks[track].steps[idx];
  if(st.assignee){
    logEvt(c, `${stepDefs(c,track)[idx].n} returned to queue by ${benchActor()}`, 'step', benchActor());
    st.assignee=null;
  }
  state.benchCaseId=null; state.benchSel=null;
  render();
}
function benchCheckIn(cid, track, idx){
  const c=getCase(cid);
  checkInStep(c, track, idx, state.benchTechId);
  state.benchMsg=null;
  render();
}
function benchComplete(cid, track, idx){
  const c=getCase(cid);
  const t=tech(state.benchTechId);
  const name = stepDefs(c,track)[idx].n;
  completeStep(c, track, idx, state.benchTechId);
  const cs = currentSteps(c);
  const cont = cs.find(s=>s.def.d===t.dept && !s.blocked && !s.def.approval);
  if(caseDone(c)){
    state.benchMsg = `✓ ${name} done — case complete: ${wfOf(c).endState==='ship'?'ready to ship':'deliver in-house'}.`;
    state.benchCaseId=null; state.benchSel=null;
    confettiBurst();
    walkMascot(`${c.id} out the door. Nice work, ${tech(state.benchTechId).name.split(' ')[0]}!`, 'cheer');
  } else if(cont){
    // next step is also this tech's department: stay on the case, ready to check in
    state.benchMsg = `✓ ${name} done — next step is yours too: ${cont.def.n}.`;
    state.benchCaseId=cid; state.benchSel={track:cont.track, idx:cont.idx};
  } else {
    state.benchMsg = `✓ ${name} done — next: ${cs.map(s=>`${s.def.n} (${s.def.d})${s.blocked?' · gated':''}${s.def.approval?' · dr approval':''}`).join(' + ')}`;
    state.benchCaseId=null; state.benchSel=null;
  }
  render();
}

function createCase(){
  const err = msg => { const e=document.getElementById('n-err'); if(e) e.textContent=msg; };
  const wfKey=document.getElementById('n-wf').value;
  const patient=document.getElementById('n-patient').value.trim();
  const di=+document.getElementById('n-doc').value;
  const raw=parseInt(document.getElementById('n-days').value,10);
  if(raw<0){ err('Days can\'t be negative — use 0 for same-day.'); return; }
  const days=isNaN(raw)? TURNAROUND_DAYS : raw;            // blank = standard two-week turnaround; ship date snaps to Mon–Thu in mkCase
  let link=document.getElementById('n-link').value.trim()||null;
  if(link){ link=link.toUpperCase(); if(/^\d+$/.test(link)) link='R-'+link; }   // "2588" and "r-2588" both work
  if(!patient){ err('Patient name is required — it\'s how everyone finds the case.'); return; }
  if(WORKFLOWS[wfKey].linked && !link){ err(WORKFLOWS[wfKey].name+' must be linked to its try-in case.'); return; }
  if(link && !getCase(link)){ err('Case '+link+' isn\'t in the system — check the number.'); return; }
  if(WORKFLOWS[wfKey].linked && link && getCase(link).wf!=='tryin'){ err(link+' is a '+wfOf(getCase(link)).name+' — a '+WORKFLOWS[wfKey].name+' links to a Denture Try-in.'); return; }
  const rush=document.getElementById('n-rush').checked;
  const c = mkCase({wf:wfKey, patient, doctor:DOCTORS[di].doc, clinic:DOCTORS[di].clinic, ship:daysFromNow(days), rush, linkedTo:link, created:now(), at:0, creator:me().name});
  const holdEl=document.getElementById('n-hold');
  if(holdEl && holdEl.checked){
    c.hold={by:me().name, when:now(), reason:'Held at check-in — needs review before work starts'};
    c.events.push({when:now(), who:me().name, text:'Case put on HOLD at check-in', type:'warn'});
  }
  const absHit = ABSENCES.filter(a=>a.to>=0 && a.from<=days).map(a=>`${tech(a.tid).name} out ${a.from===0?'now':'in '+a.from+'d'} for ${a.to-a.from+1}d`);
  if(absHit.length) c.events.push({when:now(), who:'System', text:'Capacity heads-up in this case\'s window: '+absHit.join('; '), type:'warn'});
  CASES.unshift(c);
  state.modal=null; state.caseId=c.id;
  render();
}

function pearlStatus(){
  const s=[];
  const today = d => new Date(d).toDateString()===new Date().toDateString();
  const shipped = CASES.filter(c=>caseDone(c) && !c.voided && c.events.some(e=>e.type==='done' && today(e.when))).length;
  const over = CASES.filter(c=>!caseDone(c) && dayDiff(new Date(c.ship))<0).length;
  const due = CASES.filter(c=>!caseDone(c) && dayDiff(new Date(c.ship))===0).length;
  const un = unassignedQueue().length;
  const held = CASES.filter(c=>!caseDone(c) && c.hold).length;
  const gated = CASES.filter(c=>currentSteps(c).some(x=>x.blocked)).length;
  const stalled = CASES.filter(isStalled).length;
  const rkWeek = allMoves(true).length;
  if(shipped>0) s.push({t:`${shipped} case${shipped===1?'':'s'} out the door today. That's the stuff.`, mood:'cheer'});
  if(over>0) s.push({t:`${over} overdue. Rescue mission, anyone?`, mood:'worry'});
  const behind = CASES.filter(c=>!caseDone(c) && currentSteps(c).some(x=>stepLate(c, x.track, x.idx))).length;
  if(behind>0) s.push({t:`${behind} case${behind===1?' is':'s are'} behind their step schedule. Small slips, big rushes.`, mood:'worry'});
  if(stalled>0) s.push({t:`${stalled} case${stalled===1?' hasn\'t':'s haven\'t'} moved in 2 days. Poke it.`, mood:'worry'});
  if(un>0) s.push({t:`${un} step${un===1?'':'s'} in the queue with no owner.`, mood:'think'});
  if(held>0) s.push({t:`${held} on hold, waiting for lead eyes.`, mood:'think'});
  if(gated>0) s.push({t:`${gated} case${gated===1?'':'s'} waiting on a night guard.`, mood:'think'});
  if(due>0 && over===0) s.push({t:`${due} due today and nothing late. We got this.`, mood:'happy'});
  if(un===0 && over===0 && stalled===0) s.push({t:'Queue clear, nothing late. Frame this moment.', mood:'cheer'});
  if(rkWeek===0) s.push({t:'Zero remakes this week. Witchcraft? No — craft.', mood:'cheer'});
  return s;
}

/* ===================== Team Map =====================
   Interactive responsibility web: every step in every workflow, who owns it,
   who can cover it. Reads the same skills matrix the auto-assign engine reads,
   so the picture can never drift from how work is actually routed.
   Solid line = primary. Dashed line = backup / cross-trained. Position = department.
------------------------------------------------------------------------------ */

const TM_DEPT_ORDER = ['Design','Finishing','Milling','Printing','Scanning','QC','Shipping','Front Desk'];

function tmSteps(){                       // every distinct bench step, with its department
  const seen = new Map();
  Object.values(WORKFLOWS).forEach(w=>{
    [...w.main, ...(w.ng||[])].forEach(d=>{
      if(d.approval) return;              // approvals are waits, handled in their own band
      if(!seen.has(d.n)) seen.set(d.n, {n:d.n, d:d.d, h:d.h, wfs:new Set()});
      seen.get(d.n).wfs.add(w.name);
    });
  });
  return [...seen.values()];
}
function tmApprovals(){
  const seen = new Map();
  Object.values(WORKFLOWS).forEach(w=>{
    w.main.forEach(d=>{ if(d.approval && !seen.has(d.n)) seen.set(d.n, {n:d.n, d:'Approvals', h:d.h}); });
  });
  return [...seen.values()];
}
const tmApprovers = () => TECHS.filter(t=>t.id==='t5'||t.id==='t0');   // mirrors canApprove()

function tmPeopleFor(step){               // {P:[tech], B:[tech]} for one step
  const P=[], B=[];
  TECHS.forEach(t=>{
    if(!BENCHABLE(t) && step.d!=='Front Desk' && step.d!=='Shipping') return;
    const q = stepQual(t, step);
    if(q===1) P.push(t); else if(q===2) B.push(t);
  });
  return {P, B};
}
function tmOwnedBy(t){                     // what one person owns / covers
  const own=[], cov=[];
  tmSteps().forEach(s=>{ const q=stepQual(t,s); if(q===1) own.push(s.n); else if(q===2) cov.push(s.n); });
  return {own, cov};
}

function tmSel(kind, id){
  state.tmSel = (state.tmSel && state.tmSel.kind===kind && state.tmSel.id===id) ? null : {kind, id};
  render();
}
function tmClear(){ state.tmSel=null; render(); }

/* ---- one department band, drawn as SVG ---- */
function tmBand(dept, steps){
  const NW=118, NH=34, PW=104, PH=32, GAPX=16, TOP=8, MID=76;
  const people = [...new Set(steps.flatMap(s=>{ const {P,B}=tmPeopleFor(s); return [...P,...B]; }))];
  if(!steps.length || !people.length) return '';

  // barycentre pass: pull people toward the steps they own so solid lines run near-parallel
  const W = q => q===1 ? 4 : q===2 ? 1 : 0;
  people.sort((a,b)=>{
    const bc = t => { let n=0,d=0; steps.forEach((s,i)=>{ const w=W(stepQual(t,s)); if(w){n+=w*i; d+=w;} });
                      return d? n/d : 0; };
    return bc(a)-bc(b) || a.name.localeCompare(b.name);
  });

  const wS = steps.length*(NW+GAPX), wP = people.length*(PW+GAPX);
  const W_ = Math.max(wS, wP, 300), H_ = MID+PH+TOP+6;
  const sx = i => (W_ - wS)/2 + i*(NW+GAPX) + NW/2;
  const px = i => (W_ - wP)/2 + i*(PW+GAPX) + PW/2;

  const sel = state.tmSel;
  const dim = (stepName, tid) => {
    if(!sel) return false;
    return sel.kind==='step' ? sel.id!==stepName : sel.id!==tid;
  };

  let edges='';
  steps.forEach((s,i)=>{
    const {P,B} = tmPeopleFor(s);
    [...P.map(t=>[t,1]), ...B.map(t=>[t,2])].forEach(([t,q])=>{
      const j = people.indexOf(t); if(j<0) return;
      const d = dim(s.n, t.id);
      edges += `<line x1="${sx(i)}" y1="${TOP+NH}" x2="${px(j)}" y2="${MID}"
        class="tm-edge ${q===1?'p':'b'} ${d?'dim':''}"/>`;
    });
  });

  const stepNodes = steps.map((s,i)=>{
    const {P,B} = tmPeopleFor(s);
    const d = dim(s.n, null) && !(sel && sel.kind==='person' && (P.concat(B)).some(t=>t.id===sel.id));
    const on = sel && ((sel.kind==='step' && sel.id===s.n) || (sel.kind==='person' && P.concat(B).some(t=>t.id===sel.id)));
    return `<g class="tm-node step ${d?'dim':''} ${on?'on':''}" onclick="tmSel('step',${JSON.stringify(s.n).replace(/"/g,'&quot;')})">
      <rect x="${sx(i)-NW/2}" y="${TOP}" width="${NW}" height="${NH}" rx="7"/>
      <text x="${sx(i)}" y="${TOP+NH/2}" dominant-baseline="middle">${esc(s.n)}</text>
    </g>`;
  }).join('');

  const personNodes = people.map((t,j)=>{
    const rel = steps.some(s=>stepQual(t,s)>0 && sel && sel.kind==='step' && sel.id===s.n);
    const d = sel && !( (sel.kind==='person' && sel.id===t.id) || rel );
    const on = sel && ((sel.kind==='person' && sel.id===t.id) || rel);
    const out = outToday(t.id);
    return `<g class="tm-node person ${d?'dim':''} ${on?'on':''} ${out?'out':''}"
        onclick="tmSel('person','${t.id}')">
      <rect x="${px(j)-PW/2}" y="${MID}" width="${PW}" height="${PH}" rx="7"/>
      <text x="${px(j)}" y="${MID+(t.role==='lead'||t.role==='owner'||out?13:PH/2+1)}" dominant-baseline="middle">${esc(t.name)}</text>
      ${(t.role==='lead'||t.role==='owner'||out)? `<text class="sub" x="${px(j)}" y="${MID+24}" dominant-baseline="middle">${
        out? 'out today' : (t.role==='owner'?'owner':'lead')}</text>`:''}
    </g>`;
  }).join('');

  return `<div class="tm-band">
    <h4>${esc(dept)}</h4>
    <div class="tm-scroll"><div class="tm-inner"><svg viewBox="0 0 ${W_} ${H_}" width="${W_}" height="${H_}" role="img"
      aria-label="${esc(dept)}: which people own and cover each step">${edges}${stepNodes}${personNodes}</svg></div></div>
  </div>`;
}

/* ---- the detail panel for whatever is selected ---- */
function tmPanel(){
  const sel = state.tmSel;
  if(!sel) return `<div class="card tm-hint"><b>Tap any box.</b> Tap a step to see everyone who can work it.
    Tap a person to see everything they own and everything they can cover. Tap it again to clear.</div>`;

  if(sel.kind==='person'){
    const t = tech(sel.id); if(!t) return '';
    const {own, cov} = tmOwnedBy(t);
    const appr = tmApprovers().some(a=>a.id===t.id);
    const load = BENCHABLE(t) ? techLoad(t) : null;
    return `<div class="card tm-panel">

        <div><h5>Owns (${own.length})</h5>${own.length? own.map(n=>`<span class="chip p">${esc(n)}</span>`).join(''):'<span class="subtle">nothing yet</span>'}</div>
        <div><h5>Can cover (${cov.length})</h5>${cov.length? cov.map(n=>`<span class="chip b">${esc(n)}</span>`).join(''):'<span class="subtle">nothing yet</span>'}</div>
      </div>
      ${appr? `<div class="pill">Also approves designs in Chat</div>`:''}
      ${load? `<div class="subtle" style="margin-top:6px;">Open work right now: ${load.n} step${load.n===1?'':'s'}, ${load.hrs.toFixed(1)} h</div>`:''}
    </div>`;
  }

  const step = tmSteps().concat(tmApprovals()).find(s=>s.n===sel.id); if(!step) return '';
  const isAppr = step.d==='Approvals';
  const {P,B} = isAppr ? {P:tmApprovers(), B:[]} : tmPeopleFor(step);
  const line = (arr, empty) => arr.length
    ? arr.map(t=>`<span class="chip ${outToday(t.id)?'out':''}">${esc(t.name)}${outToday(t.id)?' (out today)':''}</span>`).join('')
    : `<span class="subtle">${empty}</span>`;
  return `<div class="card tm-panel">
    <div class="tm-panel-hd"><b>${esc(step.n)}</b>
      <span class="subtle">${esc(step.d)}${step.h?` · ${step.h} h a case`:''}</span>
      <button class="btn ghost sm" onclick="tmClear()">Clear</button></div>
    <div class="tm-lists">
      <div><h5>Goes to first</h5>${line(P, 'nobody owns this step')}</div>
      <div><h5>Can cover it</h5>${line(B, P.length>1? 'not needed: more than one owner' : 'nobody named yet')}</div>
    </div>
    ${(!P.length)? `<div class="pill bad">No owner for this step. Work here has nowhere to go automatically.</div>`
      : (P.length===1? `<div class="pill warn">Only one owner. If ${esc(P[0].name)} is out, this step waits on a cover.</div>`:'')}
  </div>`;
}

function vTeamMap(){
  const byDept = {};
  tmSteps().forEach(s=>{ (byDept[s.d]=byDept[s.d]||[]).push(s); });
  const depts = TM_DEPT_ORDER.filter(d=>byDept[d]).concat(Object.keys(byDept).filter(d=>!TM_DEPT_ORDER.includes(d)));

  const appr = tmApprovals();
  const gaps = tmSteps().filter(s=>!tmPeopleFor(s).P.length);
  const solo = tmSteps().filter(s=>tmPeopleFor(s).P.length===1);

  return `
  <h2 class="pgttl">Team map <span class="subtle">who do I go to?</span></h2>
  <div class="tm-legend">
    <span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" class="tm-edge p"/></svg> owns it</span>
    <span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" class="tm-edge b"/></svg> can cover it</span>
    <span><i class="sw step"></i> a step</span>
    <span><i class="sw person"></i> a person</span>
  </div>
  ${tmPanel()}
  ${depts.map(d=>tmBand(d, byDept[d])).join('')}
  ${appr.length? `<div class="tm-band"><h4>Approvals</h4>
    <div class="tm-scroll">${tmBandApprovals(appr)}</div></div>`:''}
  ${(state.role==='lead'||state.role==='owner') ? `<div class="card">
     <h3>Coverage check</h3>
     ${gaps.length? `<div class="pill bad">${gaps.length} step${gaps.length===1?'':'s'} with no owner: ${gaps.map(s=>esc(s.n)).join(', ')}</div>`
        : `<div class="pill good">Every step has an owner.</div>`}
     ${solo.length? `<div class="pill warn">${solo.length} step${solo.length===1?'':'s'} with a single owner: ${solo.map(s=>esc(s.n)).join(', ')}</div>`:''}
     <div class="subtle" style="margin-top:6px;">This map reads the same skills matrix the auto-assign engine uses, so it
       cannot drift from how work is actually routed. Edit it in Board → Team setup.</div>
   </div>`:''}
  <div class="subtle" style="margin:10px 2px 4px;">A dashed line means qualified to cover, not that the work normally goes
    there. Leads are covers across their own specialties on purpose, so they stay free to lead. If a step you work is missing,
    tell your lead: an error here becomes an error in case assignment.</div>`;
}

function tmBandApprovals(appr){
  const NW=138, NH=34, PW=118, PH=32, GAPX=18, TOP=8, MID=76;
  const people = tmApprovers();
  const wS=appr.length*(NW+GAPX), wP=people.length*(PW+GAPX);
  const W_=Math.max(wS,wP,300), H_=MID+PH+TOP+6;
  const sx=i=>(W_-wS)/2+i*(NW+GAPX)+NW/2, px=i=>(W_-wP)/2+i*(PW+GAPX)+PW/2;
  const sel = state.tmSel;
  const isAppr = sel && sel.kind==='person' && people.some(t=>t.id===sel.id);
  const stepSel = sel && sel.kind==='step' && appr.some(s=>s.n===sel.id);
  const dimStep = s => sel && !(stepSel && sel.id===s.n) && !isAppr;
  const dimPer  = t => sel && !(sel.kind==='person' && sel.id===t.id) && !stepSel;
  let e='';
  appr.forEach((s,i)=>people.forEach((t,j)=>{
    const d = dimStep(s) || dimPer(t);
    e+=`<line x1="${sx(i)}" y1="${TOP+NH}" x2="${px(j)}" y2="${MID}" class="tm-edge p ${d?'dim':''}"/>`;
  }));
  return `<div class="tm-inner"><svg viewBox="0 0 ${W_} ${H_}" width="${W_}" height="${H_}" role="img" aria-label="who approves what">${e}
    ${appr.map((s,i)=>`<g class="tm-node step ${dimStep(s)?'dim':''} ${(stepSel&&sel.id===s.n)||isAppr?'on':''}"
        onclick="tmSel('step',${JSON.stringify(s.n).replace(/"/g,'&quot;')})">
      <rect x="${sx(i)-NW/2}" y="${TOP}" width="${NW}" height="${NH}" rx="7"/>
      <text x="${sx(i)}" y="${TOP+NH/2}" dominant-baseline="middle">${esc(s.n)}</text></g>`).join('')}
    ${people.map((t,j)=>`<g class="tm-node person ${dimPer(t)?'dim':''} ${(sel&&sel.kind==='person'&&sel.id===t.id)||stepSel?'on':''}"
        onclick="tmSel('person','${t.id}')">
      <rect x="${px(j)-PW/2}" y="${MID}" width="${PW}" height="${PH}" rx="7"/>
      <text x="${px(j)}" y="${MID+13}" dominant-baseline="middle">${esc(t.name)}</text>
      <text class="sub" x="${px(j)}" y="${MID+24}" dominant-baseline="middle">approves in Chat</text></g>`).join('')}</svg></div>`;
}
</script></body></html>
