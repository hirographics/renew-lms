<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Renew LMS — v2.1 Prototype</title>
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
  --accent:#2a78d6; --accent-soft:#e3eefb;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --rush:#e34948;
  --ng-ink:#5b21b6; --warn-ink:#8a5b00;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --surface:#1a1a19; --page:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --accent:#3987e5; --accent-soft:#16283e;
    --good-text:#0ca30c;
    --ng-ink:#b39ddb; --warn-ink:#e0b053;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--page); color:var(--ink);
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
header.app{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--grid);
  padding:10px 14px; display:flex; align-items:center; gap:10px;
}
header.app h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.2px;}
header.app .sub{font-size:11px; color:var(--muted); display:block; font-weight:500;}
.role-pick{margin-left:auto;}
select,input,textarea,button{font-family:inherit; font-size:14px; color:var(--ink);}
select,input,textarea{
  background:var(--surface); border:1px solid var(--baseline); border-radius:8px; padding:8px 10px;
}
.wrap{max-width:1100px; margin:0 auto; padding:12px 14px 24px;}
.demo-note{font-size:11px; color:var(--muted); text-align:center; margin:4px 0 10px;}

/* ---- nav ---- */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--grid);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1; background:none; border:none; padding:9px 2px 7px; cursor:pointer;
  font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px;
}
nav.tabs button .ic{font-size:19px; line-height:1;}
nav.tabs button.on{color:var(--accent); font-weight:700;}

/* ---- cards & tiles ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:12px;}
.card h3{margin:0 0 8px; font-size:13px; color:var(--ink2); font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px;}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer;}
.tile .num{font-size:26px; font-weight:700; line-height:1.1;}
.tile .lbl{font-size:10.5px; color:var(--ink2); margin-top:2px;}
.tile.alert .num{color:var(--critical);}
@media (max-width:420px){ .tile .num{font-size:22px;} }

/* ---- capacity meters ---- */
.meter-row{display:flex; align-items:center; gap:8px; margin:7px 0;}
.meter-row .dep{width:74px; font-size:12px; color:var(--ink2); flex:none;}
.meter{flex:1; height:14px; background:var(--page); border:1px solid var(--grid); border-radius:4px; position:relative; overflow:hidden;}
.meter .fill{position:absolute; left:0; top:0; bottom:0; border-radius:3px 0 0 3px;}
.meter .capline{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--baseline);}
.meter-row .val{width:88px; flex:none; font-size:11px; color:var(--ink2); text-align:right; font-variant-numeric:tabular-nums;}

/* ---- lists ---- */
.case-row{
  display:flex; align-items:center; gap:10px; padding:10px 4px;
  border-bottom:1px solid var(--grid); cursor:pointer;
}
.case-row:last-child{border-bottom:none;}
.case-row .cid{font-weight:700; font-size:13.5px; white-space:nowrap;}
.case-row .cmeta{flex:1; min-width:0;}
.case-row .l1{font-size:13px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.case-row .l2{font-size:11.5px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.case-row .ship{font-size:11px; color:var(--ink2); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
.badge{font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:99px; border:1px solid; white-space:nowrap;}
.b-rush{color:var(--critical); border-color:var(--critical);}
.b-over{color:#fff; background:var(--critical); border-color:var(--critical);}
.b-house{color:var(--accent); border-color:var(--accent);}
.b-link{color:var(--ink2); border-color:var(--baseline);}
.b-flag{color:var(--warn-ink); border-color:var(--warn); background:none;}
.b-ng{color:var(--ng-ink); border-color:#8b5cf6;}
.b-done{color:var(--good-text); border-color:var(--good);}
.b-stall{color:var(--serious); border-color:var(--serious);}
.dept-chip{font-size:10.5px; color:var(--ink2); background:var(--page); border:1px solid var(--grid); border-radius:5px; padding:1px 6px;}

/* ---- board ---- */
.board{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:760px){ .board{grid-template-columns:5fr 7fr;} }
.qcase{
  display:flex; align-items:center; gap:8px; padding:9px 8px; margin:6px 0;
  border:1px solid var(--grid); border-radius:10px; cursor:pointer; background:var(--surface);
}
.qcase.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
.tech-row{padding:8px 4px; border-bottom:1px solid var(--grid);}
.tech-row:last-child{border-bottom:none;}
.tech-head{display:flex; align-items:center; gap:8px;}
.tech-head .tname{font-size:13.5px; font-weight:600;}
.tech-head .thrs{margin-left:auto; font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums;}
.tech-load{height:6px; background:var(--page); border-radius:3px; margin:5px 0 3px; overflow:hidden; border:1px solid var(--grid);}
.tech-load i{display:block; height:100%; border-radius:3px;}
.tech-cases{font-size:11px; color:var(--muted);}
.assign-btn{
  border:1px solid var(--accent); color:var(--accent); background:none; border-radius:8px;
  font-size:11.5px; font-weight:700; padding:4px 10px; cursor:pointer;
}
.assign-hint{font-size:12px; color:var(--ink2); background:var(--accent-soft); border-radius:8px; padding:8px 10px; margin-bottom:8px;}
.assign-hint.sticky{position:sticky; top:56px; z-index:30; box-shadow:0 2px 8px rgba(0,0,0,.12);}

/* ---- case detail sheet ---- */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:760px){ .sheet-bg{align-items:center;} }
.sheet{
  background:var(--page); width:100%; max-width:680px; max-height:92vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:14px 16px calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:760px){ .sheet{border-radius:16px; max-height:86vh;} }
.sheet h2{margin:0; font-size:18px;}
.sheet .close{float:right; border:none; background:var(--surface); border:1px solid var(--grid); border-radius:99px; width:30px; height:30px; font-size:15px; cursor:pointer; color:var(--ink2);}
.kv{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink2); margin:8px 0 2px;}
.kv b{color:var(--ink);}

/* ---- timeline ---- */
.track{margin:10px 0 4px;}
.track-title{font-size:11px; font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; display:flex; gap:6px; align-items:center;}
.step{display:flex; gap:10px; position:relative; padding:0 0 2px;}
.step .rail{width:14px; flex:none; display:flex; flex-direction:column; align-items:center;}
.step .dot{width:12px; height:12px; border-radius:99px; border:2px solid var(--baseline); background:var(--surface); flex:none; margin-top:3px;}
.step.done .dot{background:var(--good); border-color:var(--good);}
.step.in .dot{background:var(--surface); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.step .line{width:2px; flex:1; background:var(--grid); min-height:10px;}
.step:last-child .line{display:none;}
.step .sbody{flex:1; padding-bottom:9px; min-width:0;}
.step .sname{font-size:13px; font-weight:600;}
.step.done .sname{color:var(--ink2); font-weight:500;}
.step .sinfo{font-size:11px; color:var(--muted); margin-top:1px;}
.step.in .sname{color:var(--accent);}
.ng-track{margin-left:22px; border-left:2px dashed #8b5cf6; padding-left:10px;}

/* ---- buttons ---- */
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
.btn{
  border:1px solid var(--baseline); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:9px 13px; font-size:13px; font-weight:600; cursor:pointer;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.danger{border-color:var(--critical); color:var(--critical);}
.btn.big{padding:16px; font-size:16px; width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---- notes / events ---- */
.note{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin:6px 0; font-size:13px;}
.note .who{font-size:11px; color:var(--muted); margin-bottom:2px;}
.evt{font-size:12px; color:var(--ink2); padding:5px 0; border-bottom:1px solid var(--grid);}
.evt:last-child{border:none;}
.evt .t{color:var(--muted); font-size:10.5px;}
.evt.warn{color:var(--warn-ink);}

/* ---- bench ---- */
.bench-step{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center;}
.bench-step .big-name{font-size:22px; font-weight:700; margin:4px 0;}
.bench-step .big-case{font-size:15px; color:var(--ink2);}
.scanbox{
  border:2px dashed var(--baseline); border-radius:14px; padding:26px 14px; text-align:center;
  color:var(--ink2); font-size:14px; cursor:pointer; background:var(--surface);
}
.scanbox .ic{font-size:34px; display:block; margin-bottom:6px;}

/* ---- inbox ---- */
.inbox-item{display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--grid); font-size:13px;}
.inbox-item:last-child{border:none;}
.inbox-item .ic{flex:none;}
.inbox-item .bx{flex:1;}
.inbox-item .t{font-size:10.5px; color:var(--muted);}

/* ---- ticket ---- */
.ticket{background:#fff; color:#0b0b0b; border-radius:12px; border:1px solid var(--grid); padding:18px; max-width:420px; margin:0 auto;}
.barcode{display:flex; align-items:flex-end; height:54px; gap:0; margin:10px 0 2px; justify-content:center;}
.barcode i{display:inline-block; background:#000; height:100%;}
.barcode-num{text-align:center; font-size:13px; letter-spacing:3px; font-weight:700; margin-bottom:8px;}
.ticket table{width:100%; border-collapse:collapse; font-size:12.5px;}
.ticket td{padding:4px 2px; border-bottom:1px solid #eee; vertical-align:top;}
.ticket .steps td{font-size:11.5px;}
.ticket .chk{width:13px; height:13px; border:1.5px solid #555; display:inline-block; border-radius:3px; vertical-align:middle;}
@media print{
  body *{visibility:hidden;}
  .sheet-bg{position:static; background:none;}
  .ticket, .ticket *{visibility:visible;}
  .ticket{position:absolute; left:0; top:0; box-shadow:none; border:none;}
}

/* ---- filters ---- */
.filters{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch;}
.fchip{border:1px solid var(--baseline); background:var(--surface); color:var(--ink2); border-radius:99px; padding:5px 12px; font-size:12px; white-space:nowrap; cursor:pointer;}
.fchip.on{background:var(--ink); color:var(--surface); border-color:var(--ink);}
.searchrow{display:flex; gap:8px; margin-bottom:8px;}
.searchrow input{flex:1;}

/* modal small */
.modal{background:var(--page); border-radius:14px; padding:16px; width:92%; max-width:440px; max-height:80vh; overflow-y:auto;}
.modal h3{margin:0 0 10px; font-size:15px; color:var(--ink);}
.opt-row{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--grid); border-radius:10px; padding:10px 12px; margin:6px 0; font-size:13.5px; cursor:pointer;}
.opt-row:active{border-color:var(--accent);}
label.f{display:block; font-size:12px; color:var(--ink2); margin:10px 0 4px; font-weight:600;}

/* ---- v1.6 polish ---- */
.card{box-shadow:0 1px 3px rgba(0,0,0,.05);}
.tile{box-shadow:0 1px 3px rgba(0,0,0,.05); transition:transform .08s ease;}
.tile:active{transform:scale(.96);}
.btn{transition:transform .08s ease, box-shadow .15s ease;}
.btn:active{transform:scale(.96);}
.btn.primary{box-shadow:0 2px 8px rgba(42,120,214,.28);}
.fchip, .qcase, .my-row, .kb-card{transition:border-color .12s ease, box-shadow .12s ease;}
.qcase:hover, .kb-card:hover{border-color:var(--accent);}
nav.tabs button .ic{padding:2px 14px; border-radius:10px; transition:background .15s ease;}
nav.tabs button.on .ic{background:var(--accent-soft);}
header.app{box-shadow:0 1px 0 var(--grid), inset 0 -2px 0 var(--accent-soft);}
.logo-molar{width:26px; height:26px; flex:none; margin-right:2px;}
.tech-row.dragover{background:var(--accent-soft); border-radius:10px;}
.qcase[draggable="true"]{cursor:grab;}
.qcase.dragging{opacity:.5;}

/* ---- Pearl the mascot, v2: walks in, stops, delivers, walks off ---- */
#pearl{position:fixed; bottom:calc(58px + env(safe-area-inset-bottom)); left:-110px; z-index:60; display:none; cursor:pointer; filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));}
#pearl.walking{display:block; animation:pearl-walk 13s cubic-bezier(.4,0,.6,1) forwards;}
#pearl .body{animation:pearl-waddle .4s ease-in-out infinite alternate; transform-origin:50% 85%;}
#pearl .p-eyes{animation:pearl-blink 3.4s infinite; transform-origin:32px 26px;}
#pearl .bub{
  position:absolute; bottom:calc(100% + 8px); left:-6px; width:max-content; max-width:210px;
  background:var(--surface); color:var(--ink); border:2px solid var(--ink);
  border-radius:14px 14px 14px 3px; padding:8px 11px; font-size:12.5px; font-weight:700; line-height:1.35;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  opacity:0; transform:scale(.6); transform-origin:bottom left;
  animation:pearl-bub 13s ease-in-out forwards;
}
@keyframes pearl-walk{
  0%{left:-110px;} 34%{left:calc(50vw - 100px);} 63%{left:calc(50vw - 100px);} 100%{left:105vw;}
}
@keyframes pearl-waddle{ from{transform:rotate(-5deg) translateY(0);} to{transform:rotate(5deg) translateY(-2.5px);} }
@keyframes pearl-blink{ 0%,93%,100%{transform:scaleY(1);} 95%,97%{transform:scaleY(.08);} }
@keyframes pearl-bub{
  0%,32%{opacity:0; transform:scale(.6);}
  37%{opacity:1; transform:scale(1.06);}
  40%{transform:scale(1);}
  62%{opacity:1; transform:scale(1);}
  70%,100%{opacity:0; transform:scale(.85);}
}
@media (prefers-reduced-motion: reduce){ #pearl{display:none !important;} }

/* ---- v1.7 aesthetic pass ---- */
body{background:radial-gradient(1100px 320px at 50% -140px, var(--accent-soft), transparent), var(--page);}
h2.pagetitle{font-size:21px; font-weight:800; letter-spacing:-.4px;}
.card{border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 5px 16px rgba(0,0,0,.05);}
.card h3{font-size:11.5px; letter-spacing:.9px;}
.tile{border-radius:16px;}
.tile .num{letter-spacing:-1px; font-size:27px;}
.btn{border-radius:12px;}
.btn.primary{border:none; background:linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 82%, #000));}
nav.tabs{border-top:none; box-shadow:0 -4px 20px rgba(0,0,0,.08); border-radius:18px 18px 0 0;}
nav.tabs button{font-weight:600;}
.sheet{border-radius:22px 22px 0 0;}
.sheet::before{content:''; display:block; width:42px; height:4px; background:var(--baseline); border-radius:99px; margin:0 auto 10px;}
@media(min-width:760px){ .sheet{border-radius:22px;} .sheet::before{display:none;} }
.meter{height:16px; border-radius:8px;}
.meter .fill{border-radius:8px;}
.fchip{border-radius:12px; padding:6px 13px;}
.assign-hint{border-radius:12px;}
.badge{letter-spacing:.4px; padding:2.5px 7px;}
.scanbox{border-radius:18px; border-width:2.5px;}
.scanbox:active{transform:scale(.98);}
.modal{border-radius:18px;}
.bench-step{border-radius:18px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 5px 16px rgba(0,0,0,.05);}
.kb-col{border-radius:14px;}
.rk-stat{border-radius:12px;}
.rk-stat .v{letter-spacing:-.5px;}

/* ---- calendar ---- */
.cal-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.cal-head b{font-size:15px; flex:1; text-align:center;}
.cal-nav{border:1px solid var(--baseline); background:var(--surface); border-radius:10px; width:34px; height:34px; font-size:15px; cursor:pointer; color:var(--ink);}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal .dow{font-size:10px; color:var(--muted); text-align:center; font-weight:700; padding:2px 0;}
.cal-cell{
  min-height:52px; background:var(--surface); border:1px solid var(--grid); border-radius:10px;
  padding:3px 4px; cursor:pointer; position:relative; transition:border-color .12s ease;
}
.cal-cell:hover{border-color:var(--accent);}
.cal-cell.off{opacity:.35; cursor:default;}
.cal-cell.today{border-color:var(--accent); border-width:2px;}
.cal-cell.sel{background:var(--accent-soft); border-color:var(--accent);}
.cal-cell .dnum{font-size:11px; font-weight:700; color:var(--ink2);}
.cal-dots{display:flex; flex-wrap:wrap; gap:2px; margin-top:3px;}
.cal-dots i{width:7px; height:7px; border-radius:3px; display:block;}
.cal-more{font-size:9px; color:var(--muted); font-weight:700;}
.cal-out{position:absolute; bottom:2px; right:4px; font-size:9.5px;}

/* ---- chat hub ---- */
.thread-row{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--grid); cursor:pointer;}
.thread-row:last-child{border-bottom:none;}
.thread-row .tr-avatar{width:38px; height:38px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff;}
.thread-row .tr-main{flex:1; min-width:0;}
.thread-row .tr-top{display:flex; gap:6px; align-items:center;}
.thread-row .tr-top b{font-size:13.5px;}
.thread-row .tr-prev{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
.thread-row .tr-when{font-size:10.5px; color:var(--muted); white-space:nowrap;}
.unread-dot{width:9px; height:9px; border-radius:99px; background:var(--accent); flex:none;}
.appr-card{
  border:2px solid var(--warn); background:var(--surface); border-radius:14px; padding:10px 12px; margin-bottom:10px;
  font-size:13px;
}
.appr-card .btnrow{margin:8px 0 0;}
.chat-full{display:flex; flex-direction:column;}
.chat-full .chat{max-height:none; flex:1;}

/* ---- pipeline card ---- */
.pipe-row{display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid var(--grid); cursor:pointer;}
.pipe-row:last-child{border:none;}
.pipe-row .arrow{color:var(--muted); font-size:11px; white-space:nowrap;}

/* ---- confetti ---- */
.confetti{position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden;}
.confetti i{position:absolute; top:-14px; width:8px; height:13px; border-radius:2px; animation:cfall 1.7s ease-in forwards;}
@keyframes cfall{ to{ transform:translateY(106vh) rotate(560deg); } }
@media (prefers-reduced-motion: reduce){ .confetti{display:none;} }
.field{width:100%;}
.empty{color:var(--muted); font-size:13px; padding:12px 0; text-align:center;}
h2.pagetitle{font-size:17px; margin:2px 0 10px;}
.subtle{font-size:12px; color:var(--muted);}

/* ---- segmented toggle ---- */
.seg{display:inline-flex; border:1px solid var(--baseline); border-radius:10px; overflow:hidden; margin-bottom:10px;}
.seg button{border:none; background:var(--surface); color:var(--ink2); padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer;}
.seg button.on{background:var(--ink); color:var(--surface);}

/* ---- kanban ---- */
.kb{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 14px; -webkit-overflow-scrolling:touch; align-items:flex-start;}
.kb-col{flex:0 0 240px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px; min-height:120px;}
.kb-col.dragover{outline:2px solid var(--accent);}
.kb-col h4{margin:2px 4px 8px; font-size:12px; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px; display:flex; justify-content:space-between;}
.kb-card{background:var(--page); border:1px solid var(--grid); border-left:4px solid var(--baseline); border-radius:9px; padding:8px 9px; margin-bottom:7px; cursor:pointer; font-size:12.5px;}
.kb-card.sel{outline:2px solid var(--accent);}
.kb-card .kc-top{display:flex; gap:6px; align-items:center; font-weight:700; font-size:12.5px;}
.kb-card .kc-step{color:var(--ink2); margin-top:2px; font-size:11.5px;}
.kb-card .kc-bot{display:flex; justify-content:space-between; margin-top:4px; font-size:10.5px; color:var(--muted);}
.kb-legend{display:flex; gap:10px; flex-wrap:wrap; font-size:10.5px; color:var(--ink2); margin:0 0 8px;}
.kb-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px;}

/* ---- my work list (bench) ---- */
.my-row{display:flex; align-items:center; gap:8px; padding:9px 8px; margin:6px 0; border:1px solid var(--grid); border-radius:10px; cursor:pointer; background:var(--surface);}
.my-row.working{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}
.my-row .st{font-size:10px; font-weight:700; padding:2px 6px; border-radius:99px; border:1px solid var(--baseline); color:var(--ink2);}
.my-row .st.in{color:var(--accent); border-color:var(--accent);}

.linklike{background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; padding:0;}
.chek{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:8px 2px;}

/* ---- case chat ---- */
.chat{display:flex; flex-direction:column; gap:6px; max-height:280px; overflow-y:auto; padding:2px;}
.chat-msg{background:var(--surface); border:1px solid var(--grid); border-radius:12px 12px 12px 3px; padding:7px 10px; font-size:13px; max-width:92%; align-self:flex-start;}
.chat-msg.mine{align-self:flex-end; border-radius:12px 12px 3px 12px; background:var(--accent-soft); border-color:var(--accent);}
.chat-msg .cwho{font-size:10.5px; color:var(--muted); margin-bottom:2px; font-weight:600;}
.chat-msg .cping{display:inline-block; font-size:10px; font-weight:700; color:var(--accent); border:1px solid var(--accent); border-radius:99px; padding:1px 7px; margin-bottom:3px;}
.chat-in{display:flex; gap:6px; margin-top:8px;}
.chat-in input{flex:1;}
.chat-ping{margin-top:6px; display:flex; gap:6px; align-items:center; font-size:12px; color:var(--ink2);}
.chat-ping select{padding:5px 8px; font-size:12px;}

/* ---- remake mini-bars ---- */
.rk-row{display:flex; align-items:center; gap:8px; margin:4px 0;}
.rk-row .lbl{width:150px; font-size:12px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rk-row .bar{flex:1; height:12px; background:var(--page); border:1px solid var(--grid); border-radius:4px; overflow:hidden;}
.rk-row .bar i{display:block; height:100%; background:var(--accent); border-radius:3px 0 0 3px;}
.rk-row .n{width:26px; text-align:right; font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums;}
.rk-stats{display:flex; gap:8px; margin:4px 0 10px;}
.rk-stat{flex:1; text-align:center; background:var(--page); border:1px solid var(--grid); border-radius:10px; padding:7px 4px;}
.rk-stat .v{font-size:19px; font-weight:700;}
.rk-stat .k{font-size:10.5px; color:var(--ink2);}

/* ---- team map (responsibility web) ---- */
.tm-legend{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:0 2px 10px; font-size:11.5px; color:var(--ink2);}
.tm-legend span{display:flex; align-items:center; gap:6px;}
.tm-legend i.sw{width:20px; height:12px; border-radius:4px; display:inline-block;}
.tm-legend i.sw.step{background:var(--accent-soft); border:1px solid var(--accent);}
.tm-legend i.sw.person{background:var(--surface); border:1px solid var(--baseline);}

.tm-band{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 4px 6px; margin-bottom:10px;}
.tm-band h4{margin:2px 0 2px 11px; font-size:11.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.6px; color:var(--accent);}
.tm-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 8px 4px;}
.tm-inner{display:table; margin:0 auto;}
.tm-scroll svg{display:block; max-width:none;}

line.tm-edge{fill:none;}
line.tm-edge.p{stroke:var(--accent); stroke-width:2.2; stroke-linecap:round;}
line.tm-edge.b{stroke:var(--baseline); stroke-width:1.3; stroke-dasharray:4 3.5; stroke-linecap:round;}
line.tm-edge.dim{opacity:.12;}

.tm-node{cursor:pointer;}
.tm-node rect{transition:fill .12s ease, stroke .12s ease, opacity .12s ease;}
.tm-node text{font-size:11px; text-anchor:middle; fill:var(--ink); pointer-events:none;}
.tm-node text.sub{font-size:8.5px; fill:var(--muted);}
.tm-node.step rect{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1;}
.tm-node.step text{font-weight:700; font-size:10.5px;}
.tm-node.person rect{fill:var(--surface); stroke:var(--baseline); stroke-width:1;}
.tm-node.out rect{stroke:var(--serious); stroke-width:1.6; stroke-dasharray:5 3;}
.tm-node.on rect{stroke:var(--ink); stroke-width:2;}
.tm-node.dim{opacity:.22;}
.tm-node:hover rect{stroke:var(--ink);}

.tm-hint{font-size:12.5px; color:var(--ink2);}
.tm-panel-hd{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:7px;}
.tm-panel-hd .btn{margin-left:auto;}
.tm-lists{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){ .tm-lists{grid-template-columns:1fr;} }
.tm-lists h5{margin:0 0 5px; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700;}
.chip{display:inline-block; font-size:11.5px; border-radius:99px; padding:3px 9px; margin:0 4px 4px 0;
  background:var(--page); border:1px solid var(--grid); color:var(--ink);}
.chip.p{background:var(--accent-soft); border-color:var(--accent);}
.chip.b{border-style:dashed; border-color:var(--baseline);}
.chip.out{border-color:var(--serious); color:var(--warn-ink);}
.pill{display:inline-block; font-size:11.5px; border-radius:8px; padding:5px 9px; margin:6px 6px 0 0;
  background:var(--page); border:1px solid var(--grid); color:var(--ink2);}
.pill.good{background:rgba(12,163,12,.10); border-color:var(--good); color:var(--good-text);}
.pill.warn{background:rgba(250,178,25,.14); border-color:var(--warn); color:var(--warn-ink);}
.pill.bad{background:rgba(208,59,59,.10); border-color:var(--critical); color:var(--critical);}
.btn.sm{padding:4px 10px; font-size:11.5px;}

<div id="app"></div>
<script>
/* ===================== Renew LMS v1 Prototype — data model & seed ===================== */
/* All data is in-memory sample data. Resets on reload. */

const now = () => new Date();
const hoursAgo = h => new Date(Date.now() - h*3600e3);
const daysFromNow = d => { const x = new Date(); x.setDate(x.getDate()+d); return x; };

const dayDiff = d => Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/86400e3);

const DEPTS = ['Scanning','Design','Milling','Printing','Finishing','QC','Shipping'];

  {id:'t1',  name:'Richard C.', dept:'Finishing', role:'lead'},

const tech = id => TECHS.find(t=>t.id===id);
const HOURS_PER_DAY = 9;        // 10h shift (Mon–Thu) minus ~1h breaks/cleanup — tune with real scan data
const TURNAROUND_DAYS = 14;     // default two-week turnaround

/* ---- work week: Monday–Thursday, 10h days; shipping only on work days ---- */
const isWorkday = d => { const w=new Date(d).getDay(); return w>=1 && w<=4; };
function snapWorkday(d){ const x=new Date(d); while(!isWorkday(x)) x.setDate(x.getDate()+1); return x; }
function addWorkdays(d, n){ const x=new Date(d); let k=0; while(k<n){ x.setDate(x.getDate()+1); if(isWorkday(x)) k++; } return x; }
function workdaysBetween(a, b){   // workdays after a, up to and including b
  let n=0; const x=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const end=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  while(x<end){ x.setDate(x.getDate()+1); if(isWorkday(x)) n++; }
  return n;
}

/* ---- skills matrix: default = every step of your own department at primary level.
   Overrides: 0 = can't do it (yet), 1 = primary, 2 = backup / cross-trained. ---- */
const SKILL_OVERRIDES = {
  t4:  {'Structure':0},                                   // Kayla — still training on structure
  t12: {'Cement/Polish':2, 'Finishing':2},                // Ines (QC) cross-trained as finishing backup
  t3:  {'QC':2},                                          // Diego can cover QC in a pinch
  t7:  {'Scanning':2},                                    // Tomas can scan
};

/* ---- absences: from/to are inclusive date offsets from today (0 = today) ---- */
let ABSENCES = [
  {tid:'t3', from:0, to:0, note:'out sick'},              // Diego out today
  {tid:'t6', from:4, to:8, note:'vacation'},              // Priya out next week
];

/* ---- Workflows (from the documented 3Shape production flows) ---- */
const WORKFLOWS = {

    main:[

      {n:'Tooth Setup Approval', d:'Design', h:0.3, approval:true},
      {n:'Final Design', d:'Design', h:1.0},
      {n:'Final Design Approval', d:'Design', h:0.3, approval:true},
      {n:'CAM-Print', d:'Printing', h:1.0},
      {n:'Finishing', d:'Finishing', h:1.5},
      {n:'QC', d:'QC', h:0.3},
      {n:'Shipping', d:'Shipping', h:0.2},
    ]
  },
  proto: {
    name:'Prototype (Digital)', endState:'ship',
    main:[
      {n:'Scanning', d:'Scanning', h:0.5},
      {n:'Set Teeth', d:'Design', h:1.5},
      {n:'Tooth Setup Approval', d:'Design', h:0.3, approval:true},
      {n:'Final Design', d:'Design', h:1.0},
      {n:'Final Design Approval', d:'Design', h:0.3, approval:true},
      {n:'CAM-Print', d:'Printing', h:1.0},
      {n:'Finishing', d:'Finishing', h:1.5},
      {n:'QC', d:'QC', h:0.3},
      {n:'Shipping', d:'Shipping', h:0.2},
    ]
  },
  final: {
    name:'Final Denture', endState:'ship', linked:true,
    main:[
      {n:'Final Design', d:'Design', h:1.0},
      {n:'Final Design Approval', d:'Design', h:0.3, approval:true},
      {n:'CAM-Mill', d:'Milling', h:1.5},
      {n:'Finishing', d:'Finishing', h:2.0},
      {n:'QC', d:'QC', h:0.3},
      {n:'Shipping', d:'Shipping', h:0.2},

  },

    main:[
      {n:'Scanning', d:'Scanning', h:0.5},

      {n:'Final Design', d:'Design', h:1.0},
      {n:'Final Design Approval', d:'Design', h:0.3, approval:true},
      {n:'CAM-Print', d:'Printing', h:1.0},
      {n:'CAM-Mill', d:'Milling', h:1.0},

      {n:'CAM-Mill', d:'Milling', h:2.0},
      {n:'Contour/Sinter', d:'Milling', h:1.5},
      {n:'Inspection', d:'QC', h:0.5},
      {n:'Adjustment/Prep', d:'Finishing', h:1.0},
      {n:'Stain', d:'Finishing', h:1.0},
      {n:'Structure', d:'Finishing', h:1.5},
      {n:'Cement/Polish', d:'Finishing', h:1.0},
      {n:'QC', d:'QC', h:0.5},
      {n:'Shipping', d:'Shipping', h:0.2},
    ],
    // Night-guard parallel track: spawns when main completes Adjustment/Prep (idx 6);
    // main QC (idx 10) is gated until the NG track is complete.
    ng:[
      {n:'NG Scanning', d:'Scanning', h:0.3},
      {n:'NG Design', d:'Design', h:0.8},
      {n:'CAM-Print (NG)', d:'Printing', h:0.8},
    ],
    forkAfter:6, joinAt:10,
  },
};

/* ---- Reason codes (same 21-code / 6-group list as the remake tracker) ---- */
const REASONS = {
  'Design':['Occlusion','Midline / esthetic setup','Margin / intaglio','Wrong mould or shade in design'],
  'CAD / Data':['Scan error','Rx entered wrong','Wrong file sent'],
  'Fabrication':['Print defect','Mill defect','Sintering defect','Nesting / support error'],
  'Fit':['Passivity / Quarter Turn fail','Doesn\'t seat','Screw access misaligned'],
  'Finishing':['Fracture / chip','Shade / stain mismatch','Over-adjusted','Cementation defect'],
  'External':['Doctor-requested change','Damaged in shipping','Patient-driven change'],
};

const DOCTORS = [
  {doc:'Dr. Nguyen', clinic:'Summit Smiles'},
  {doc:'Dr. Patel', clinic:'Ridgeline Dental'},
  {doc:'Dr. Okafor', clinic:'Harbor Dental Group'},
  {doc:'Dr. Weiss', clinic:'In-house practice'},
];

/* ---- Case factory ---- */
let caseSeq = 2680;
const DEPT_SEED_TECH = {Scanning:'t11', Design:'t6', Milling:'t8', Printing:'t10', Finishing:'t3', QC:'t12', Shipping:'t13'};
function mkSteps(defs){ return defs.map(s=>({status:'todo', assignee:null, start:null, end:null})); }
function mkCase(o){
  const wf = WORKFLOWS[o.wf];
  const c = {
    id:'R-'+(o.id||caseSeq++),
    patient:o.patient, doctor:o.doctor, clinic:o.clinic,
    wf:o.wf, rush:!!o.rush, linkedTo:o.linkedTo||null,
    created:o.created||daysFromNow(-5), ship:snapWorkday(o.ship),   // shipping happens Mon–Thu
    tracks:{ main:{steps:mkSteps(wf.main)} },
    notes:o.notes||[], events:[], flag:null, nudges:[],
    moveLog:o.moveLog||[],
  };
  // advance main to given index; mark statuses
  const adv = o.at||0;
  for(let i=0;i<adv;i++){ const st=c.tracks.main.steps[i]; st.status='done'; st.assignee=DEPT_SEED_TECH[wf.main[i].d]||null; st.end=hoursAgo((adv-i)*20 + (o.age||0)); }
  if(o.status==='in'){ const st=c.tracks.main.steps[adv]; st.status='in'; st.assignee=o.assignee; st.start=hoursAgo(1.5); }
  else if(o.assignee){ c.tracks.main.steps[adv].assignee=o.assignee; }
  if(o.ngAt!==undefined && wf.ng){
    c.tracks.ng={steps:mkSteps(wf.ng)};
    for(let i=0;i<o.ngAt;i++){ const st=c.tracks.ng.steps[i]; st.status='done'; st.end=hoursAgo((o.ngAt-i)*8); }
    if(o.ngStatus==='in'){ const st=c.tracks.ng.steps[o.ngAt]; st.status='in'; st.assignee=o.ngAssignee; st.start=hoursAgo(0.7); }
    else if(o.ngAssignee){ c.tracks.ng.steps[o.ngAt].assignee=o.ngAssignee; }
  }
  if(o.doneCase){
    c.tracks.main.steps.forEach((st,i)=>{ st.status='done'; st.assignee=DEPT_SEED_TECH[wf.main[i].d]||null; st.end=hoursAgo((wf.main.length-i)*6+(o.doneAgeH||18)); });
    if(c.tracks.ng) c.tracks.ng.steps.forEach(st=>{ st.status='done'; st.end=hoursAgo(30); });
  }
  c.events.push({when:c.created, who:o.creator||'Dana L.', text:'Case created' + (c.linkedTo?' — linked to '+c.linkedTo:''), type:'sys'});
  (o.extraEvents||[]).forEach(e=>c.events.push(e));
  return c;
}

let CASES = [
  // HERO: sleeve w/ NG mid-parallel — case IS visible in finishing while NG runs
  mkCase({wf:'sleeve', patient:'Alvarez, M.', doctor:'Dr. Patel', clinic:'Ridgeline Dental',
    ship:daysFromNow(2), at:7, status:'in', assignee:'t2', by:'t8',

  mkCase({wf:'proto', patient:'Huang, L.', doctor:'Dr. Patel', clinic:'Ridgeline Dental',

  // final denture linked, in finishing, ships today
  mkCase({wf:'final', patient:'Ito, N.', doctor:'Dr. Okafor', clinic:'Harbor Dental Group',

  // flangeless in-house, finishing, unassigned, seat today
  mkCase({wf:'flange', patient:'Kim, D.', doctor:'Dr. Weiss', clinic:'In-house practice',

    notes:[{who:'Dr. Weiss', when:daysFromNow(-1), text:'Surgery moved up to this afternoon — needs to be chairside by 1pm.'}]}),
  // try-in STALLED at scanning 3 days, unassigned, overdue
  mkCase({wf:'tryin', patient:'Lopez, V.', doctor:'Dr. Patel', clinic:'Ridgeline Dental',
    ship:daysFromNow(-1), at:0, created:daysFromNow(-4), age:50,
    extraEvents:[{when:hoursAgo(70), who:'System', text:'No movement in 72h', type:'sys'}]}),
  // proto shipped yesterday (with a historical external remake + a revision on record)
  mkCase({wf:'proto', patient:'Marsh, E.', doctor:'Dr. Okafor', clinic:'Harbor Dental Group',
    ship:daysFromNow(-1), doneCase:true, created:daysFromNow(-10),
    moveLog:[
      {when:hoursAgo(96), by:'Richard C.', from:'QC', to:'Finishing', group:'Finishing', code:'Shade / stain mismatch', rtype:'External remake', person:'Kayla P.'},
      {when:hoursAgo(150), by:'Lena V.', from:'Final Design Approval', to:'Final Design', group:'External', code:'Doctor-requested change', rtype:'Revision', person:'—'},
    ]}),

/* ===================== engine ===================== */
function trackIdx(c, track){
  const steps = c.tracks[track].steps;
  for(let i=0;i<steps.length;i++) if(steps[i].status!=='done') return i;
  return -1;
}
function ngDone(c){ return !c.tracks.ng ? false : trackIdx(c,'ng')===-1; }
function isBlocked(c, track, idx){

}
function caseDone(c){
  if(c.voided) return true;
  if(trackIdx(c,'main')!==-1) return false;
  if(c.tracks.ng && trackIdx(c,'ng')!==-1) return false;
  return true;
}
function voidCase(cid){

}
function currentSteps(c){
  if(caseDone(c)) return [];
  const out=[];
  for(const track of Object.keys(c.tracks)){
    const i = trackIdx(c, track);
    if(i===-1) continue;
    out.push({track, idx:i, def:stepDefs(c,track)[i], st:c.tracks[track].steps[i], blocked:isBlocked(c,track,i)});
  }
  return out;
}
function lastActivity(c){
  let t = new Date(c.created).getTime();
  c.events.forEach(e=>{ t=Math.max(t, new Date(e.when).getTime()); });
  c.notes.forEach(n=>{ t=Math.max(t, new Date(n.when).getTime()); });
  for(const tr of Object.values(c.tracks)) tr.steps.forEach(s=>{
    if(s.start) t=Math.max(t,new Date(s.start).getTime());
    if(s.end) t=Math.max(t,new Date(s.end).getTime());
  });
  return t;
}
function isStalled(c){ return !caseDone(c) && (Date.now()-lastActivity(c)) > 48*3600e3; }
/* ---- per-step due dates, back-computed from the ship date across Mon–Thu workdays ----
   Steps are spread over the case's workday window proportionally to their est hours;
   the last main step lands exactly on the ship date. NG steps fit between fork and join. */
function stepDueMap(c){
  const wf=wfOf(c);
  const created=new Date(c.created), ship=new Date(c.ship);
  const W=Math.max(1, workdaysBetween(created, ship));
  const total=wf.main.reduce((a,d)=>a+d.h,0)||1;
  let cum=0;
  const mainDue=wf.main.map(d=>{
    cum+=d.h;
    let due=addWorkdays(created, Math.min(W, Math.max(1, Math.ceil(cum/total*W))));
    if(due>ship) due=new Date(ship);
    return due;
  });
  mainDue[wf.main.length-1]=new Date(ship);
  const out={main:mainDue};
  if(wf.ng){
    const start=mainDue[wf.forkAfter], end=mainDue[wf.joinAt];
    const nW=Math.max(1, workdaysBetween(start, end));
    const nTotal=wf.ng.reduce((a,d)=>a+d.h,0)||1;
    let nc=0;
    out.ng=wf.ng.map(d=>{
      nc+=d.h;
      let due=addWorkdays(start, Math.min(nW, Math.max(1, Math.ceil(nc/nTotal*nW))));
      if(due>end) due=new Date(end);
      return due;
    });
  }

}
function stepDue(c, track, idx){ const m=stepDueMap(c); return (m[track]||[])[idx]||null; }

  const d=stepDue(c, track, idx);
  return !!d && dayDiff(d)<0;
}
function dueLabel(c, track, idx, st){
  if(st.status==='done') return '';
  const d=stepDue(c, track, idx);
  if(!d) return '';
  const dd=dayDiff(d);
  return ` · due ${dd===0?'today':fmtDate(d)}${dd<0?' ⚠ late':''}`;
}
function logEvt(c, text, type, who){ c.events.push({when:now(), who:who||me().name, text, type:type||'sys'}); }
function benchActor(){ return tech(state.benchTechId).name; }
// notes/flags/nudges started from the bench (incl. the case sheet opened from it) belong to the bench identity
function actorName(fromBench){ return (fromBench || state.view==='bench') ? benchActor() : me().name; }

function completeStep(c, track, idx, byTechId){
  const st = c.tracks[track].steps[idx];
  const def = stepDefs(c,track)[idx];
  st.status='done'; st.end=now(); if(!st.assignee) st.assignee=byTechId;
  delete st.prev;
  logEvt(c, `${def.n} completed by ${tech(byTechId).name}`, 'step', tech(byTechId).name);
  const wf = wfOf(c);
  if(track==='main' && wf.ng!==undefined && wf.forkAfter===idx && !c.tracks.ng){
    c.tracks.ng = {steps: wf.ng.map(()=>({status:'todo', assignee:null, start:null, end:null}))};

  }

    if(c.flag) logEvt(c, `Case completed with an open flag from ${c.flag.by}: "${c.flag.text}" — review before closing out`, 'warn');

    logEvt(c, `${def.n}: ${tech(byTechId).name} checked in (was assigned to ${tech(st.assignee).name})`, 'warn', tech(byTechId).name);
  } else if(!st.assignee){
    logEvt(c, `${def.n}: ${tech(byTechId).name} self-assigned by scan`, 'step', tech(byTechId).name);
  } else {
    logEvt(c, `${def.n}: ${tech(byTechId).name} checked in`, 'step', tech(byTechId).name);

function moveBack(c, targetIdx, group, code, rtype, person){
  const steps = c.tracks.main.steps;
  const defs = stepDefs(c,'main');
  const fromIdx = trackIdx(c,'main');
  const fromName = fromIdx===-1 ? 'Complete' : defs[fromIdx].n;
  for(let i=targetIdx;i<steps.length;i++){
    if(steps[i].status!=='todo' || steps[i].assignee){
      steps[i].status='todo'; steps[i].start=null; steps[i].end=null; steps[i].assignee=null;
    }
  }
  const wf = wfOf(c);
  if(wf.ng!==undefined && c.tracks.ng && targetIdx<=wf.forkAfter){
    delete c.tracks.ng;
    logEvt(c, 'Night-guard track reset — will restart after '+defs[wf.forkAfter].n, 'sys');
  }
  const entry = {when:now(), by:me().name, from:fromName, to:defs[targetIdx].n, group, code, rtype:rtype||'Internal remake', person:person||'—'};
  c.moveLog.push(entry);
  logEvt(c, `Moved back (${entry.rtype}): ${fromName} → ${defs[targetIdx].n}. Reason: ${group} — ${code}${entry.person!=='—' ? ' · responsible: '+entry.person : ''}`, 'moveback');
}
function allMoves(weekOnly){
  const cutoff = Date.now() - 7*86400e3;
  return CASES.flatMap(c=>c.moveLog.map(m=>({c,...m})))
    .filter(m=>!weekOnly || new Date(m.when).getTime()>=cutoff)
    .sort((a,b)=>new Date(b.when)-new Date(a.when));
}

/* ===================== derived ===================== */
function unassignedQueue(){
  const q=[];
  CASES.forEach(c=>{
    currentSteps(c).forEach(s=>{
      if(!s.st.assignee && !s.blocked && !s.def.approval) q.push({c, ...s});
    });
  });
  q.sort((a,b)=> (new Date(a.c.ship)-new Date(b.c.ship)) || ((a.c.rush?0:1)-(b.c.rush?0:1)));
  return q;
}
function linkedNotes(c){
  if(!c.linkedTo) return null;

  if(!lc || !lc.notes.length) return null;
  return {id:lc.id, notes:lc.notes.slice(-2).reverse()};
}
/* ---- case chat: one thread per case; a message can also ping a department ---- */
function chatThread(c){ return c.notes.slice().sort((a,b)=>new Date(a.when)-new Date(b.when)); }

function techOpenSteps(tid){
  const out=[];
  CASES.forEach(c=>{
    for(const track of Object.keys(c.tracks)){
      const defs = stepDefs(c,track);
      c.tracks[track].steps.forEach((st,i)=>{
        if(st.assignee===tid && st.status!=='done' && !defs[i].approval){   // approvals are doctor waits, not bench work
          out.push({c, track, idx:i, def:defs[i], st, blocked:isBlocked(c,track,i), current: trackIdx(c,track)===i});
        }
      });
    }
  });
  out.sort((a,b)=> new Date(a.c.ship)-new Date(b.c.ship));
  return out;
}
function techLoad(t){
  const rows = techOpenSteps(t.id);
  return {hrs: rows.reduce((a,r)=>a+r.def.h,0), n: rows.length};
}
/* ---- skills + availability ---- */
function stepQual(t, def){          // 0 = can't, 1 = primary, 2 = backup/cross-trained
  const o=SKILL_OVERRIDES[t.id];
  if(o && o[def.n]!==undefined) return o[def.n];
  return t.dept===def.d ? 1 : 0;
}
function isOutOn(tid, dayOffset){ return ABSENCES.some(a=>a.tid===tid && dayOffset>=a.from && dayOffset<=a.to); }
function outToday(tid){ return isOutOn(tid,0); }
function techAbsences(tid){ return ABSENCES.map((a,i)=>({...a,i})).filter(a=>a.tid===tid && a.to>=0); }
function deptStepNames(dept){
  const s=new Set();
  Object.values(WORKFLOWS).forEach(w=>{
    w.main.forEach(d=>{ if(d.d===dept && !d.approval) s.add(d.n); });
    (w.ng||[]).forEach(d=>{ if(d.d===dept) s.add(d.n); });
  });
  return [...s];
}
/* ---- auto-draft assignment ----
   Strict tiers: primary techs → backup techs → primary leads → backup leads.
   Backups only get work when every primary is full; leads only when no tech has capacity. */
function assignTier(t, def){ return (t.role==='lead'?2:0) + (stepQual(t,def)===2?1:0); }
function computeDraft(){
  const picks=[], overflow=[];
  const loads={}; TECHS.forEach(t=>loads[t.id]=techLoad(t).hrs);
  const q=unassignedQueue();
  q.forEach(item=>{
    if(item.c.hold) return;                                  // held cases are omitted by design
    const cands=TECHS.filter(t=>BENCHABLE(t) && !outToday(t.id) && stepQual(t,item.def)>0);
    if(!cands.length){
      overflow.push({item, reason:'no one qualified is in today', options:[`first qualified back: ${firstBack(item)}`, slipOption(item)]});
      return;
    }
    const fit=cands.filter(t=> loads[t.id]+item.def.h <= HOURS_PER_DAY + 1e-9);
    if(!fit.length){
      cands.sort((a,b)=>(loads[a.id]+item.def.h)-(loads[b.id]+item.def.h));
      const least=cands[0], over=(loads[least.id]+item.def.h-HOURS_PER_DAY);
      overflow.push({item, reason:'everyone qualified is full today (leads included)', options:[
        `least loaded: ${least.name} would go ${over.toFixed(1)}h over`,
        `first qualified free tomorrow: ${firstBack(item)}`,
        slipOption(item),
      ]});
      return;
    }
    fit.sort((a,b)=> (assignTier(a,item.def)-assignTier(b,item.def)) || ((loads[a.id]+item.def.h)-(loads[b.id]+item.def.h)));
    const t=fit[0];
    picks.push({cid:item.c.id, track:item.track, idx:item.idx, stepName:item.def.n, h:item.def.h, tid:t.id, before:loads[t.id], backup:stepQual(t,item.def)===2, lead:t.role==='lead'});
    loads[t.id]+=item.def.h;
  });
  return {picks, overflow};
}
function firstBack(item){
  for(let d=1; d<=14; d++){
    const t=TECHS.find(x=>BENCHABLE(x) && stepQual(x,item.def)>0 && !isOutOn(x.id,d));
    if(t) return `${t.name} (${d===1?'tomorrow':'in '+d+' days'})`;
  }

}

function runDraft(){ state.draft=computeDraft(); render(); }
function dropPick(i){ state.draft.picks.splice(i,1); render(); }
function cancelDraft(){ state.draft=null; render(); }
function confirmDraft(){
  let applied=0;
  state.draft.picks.forEach(p=>{
    const c=getCase(p.cid);
    const st=c.tracks[p.track].steps[p.idx];
    if(trackIdx(c,p.track)===p.idx && !st.assignee){
      st.assignee=p.tid;

      applied++;

  const held=CASES.filter(c=>!caseDone(c) && c.hold).length;
  const leadPicks=state.draft.picks.filter(p=>p.lead).length;
  state.boardMsg=`✓ ${applied} assignment${applied===1?'':'s'} confirmed.${leadPicks? ' '+leadPicks+' went to leads (techs full).':''}${state.draft.overflow.length? ' '+state.draft.overflow.length+' left in queue (no capacity).':''}${held? ' '+held+' held case'+(held===1?'':'s')+' omitted.':''}`;
  state.draft=null;
  walkMascot(applied? 'Board is set. Go make teeth!' : 'Nothing to hand out. Suspicious…', applied?'cheer':'think');
  render();
}
/* ---- absences ---- */
function markOut(tid, from, days, note){
  if(from<0) return;                                     // no ghost absences in the past
  ABSENCES.push({tid, from, to:from+Math.max(0,days-1), note:note||''});
  if(from===0){
    // redistribute: queued steps go back to the pool; in-progress work is flagged for a lead decision
    let returned=0;
    CASES.forEach(c=>{
      for(const track of Object.keys(c.tracks)){
        c.tracks[track].steps.forEach((st,i)=>{
          if(st.assignee===tid && st.status==='todo'){
            st.assignee=null; returned++;
            logEvt(c, `${stepDefs(c,track)[i].n} returned to queue — ${tech(tid).name} out`, 'step');
          } else if(st.assignee===tid && st.status==='in'){
            c.flag = c.flag || {by:'System', when:now(), text:`${tech(tid).name} is out with ${stepDefs(c,track)[i].n} checked in — needs a lead decision`};
            logEvt(c, `${tech(tid).name} out with ${stepDefs(c,track)[i].n} in progress — flagged`, 'warn');
          }
        });
      }
    });
    state.boardMsg = `${tech(tid).name} marked out — ${returned} queued step${returned===1?'':'s'} returned to the pool. Re-run auto-draft to redistribute.`;
  } else {
    state.boardMsg = `${tech(tid).name} marked out starting ${fmtDate(daysFromNow(from))} for ${days} day${days===1?'':'s'}.`;
  }
  render();
}
function removeAbsence(i){ ABSENCES.splice(i,1); render(); }
function cycleSkill(tid, step){
  const t=tech(tid);
  SKILL_OVERRIDES[tid]=SKILL_OVERRIDES[tid]||{};
  const cur = SKILL_OVERRIDES[tid][step]!==undefined ? SKILL_OVERRIDES[tid][step] : (deptStepNames(t.dept).includes(step)?1:0);
  SKILL_OVERRIDES[tid][step] = cur===1? 2 : cur===2? 0 : 1;
  render();
}
/* ---- hold flag ---- */
function setHold(cid, reason){

function deptLoad(){
  const load={}; DEPTS.forEach(d=>load[d]=0);
  CASES.forEach(c=>{
    currentSteps(c).forEach(s=>{ if(!s.blocked && !s.def.approval && load[s.def.d]!==undefined) load[s.def.d]+=s.def.h; });

  return DEPTS.map(d=>{
    const cap = TECHS.filter(t=>t.dept===d).length*HOURS_PER_DAY;
    return {dept:d, load:load[d], cap};
  });
}
function typeLoad(){
  const out={};
  CASES.filter(c=>!caseDone(c)).forEach(c=>{
    let rem=0;
    for(const track of Object.keys(c.tracks)){
      const defs=stepDefs(c,track);
      c.tracks[track].steps.forEach((st,i)=>{ if(st.status!=='done') rem+=defs[i].h; });
    }
    const k=wfOf(c).name;
    out[k]=out[k]||{hrs:0,n:0}; out[k].hrs+=rem; out[k].n++;
  });
  return Object.entries(out).map(([name,v])=>({name,...v})).sort((a,b)=>b.hrs-a.hrs);
}
function priorityReport(){
  const rows = CASES.filter(c=>!caseDone(c)).map(c=>{
    const dd = dayDiff(new Date(c.ship));
    let score=0; const why=[];
    if(dd<0){ score+=100; why.push('overdue'); }
    else if(dd===0){ score+=80; why.push(wfOf(c).endState==='ship'?'ships today':'seats today'); }
    else if(dd===1){ score+=40; why.push('ships tomorrow'); }
    if(c.rush){ score+=30; why.push('rush'); }
    if(isStalled(c)){ score+=25; why.push('stalled'); }
    if(currentSteps(c).some(s=>stepLate(c, s.track, s.idx))){ score+=20; why.push('step behind schedule'); }
    if(currentSteps(c).some(s=>s.def.approval)){ score+=10; why.push('waiting on doctor'); }
    else if(currentSteps(c).some(s=>!s.st.assignee && !s.blocked)){ score+=10; why.push('unassigned'); }
    if(currentSteps(c).some(s=>s.blocked)){ why.push('QC gated on NG'); }
    if(c.hold){ why.push('⏸ on hold'); }
    return {c, score, why, dd};
  }).filter(r=>r.score>0);
  rows.sort((a,b)=>b.score-a.score || a.dd-b.dd);
  return rows;
}
function inboxItems(){
  const items=[];
  CASES.filter(c=>!caseDone(c)).forEach(c=>{
    if(c.flag) items.push({kind:'flag', c, ni:-1, when:c.flag.when, who:c.flag.by, text:c.flag.text});
    c.nudges.forEach((n,ni)=>items.push({kind:'nudge', c, ni, when:n.when, who:n.from, text:`→ ${n.toDept}: ${n.text}`}));
  });
  items.sort((a,b)=>new Date(b.when)-new Date(a.when));
  return items;
}

function shipLabel(c){
  const dd = dayDiff(new Date(c.ship));
  const word = wfOf(c).endState==='ship' ? 'Ship' : 'Seat';
  if(caseDone(c)) return fmtDate(new Date(c.ship));
  if(dd===0) return word+' today';
  if(dd===1) return word+' tmrw';
  if(dd<0) return `${-dd}d late`;
  return word+' '+fmtDate(new Date(c.ship));
}
function caseBadges(c){
  const b=[];
  const dd = dayDiff(new Date(c.ship));
  if(c.voided) b.push('<span class="badge b-stall">VOIDED</span>');
  else if(caseDone(c)) b.push(`<span class="badge b-done">✓ ${wfOf(c).endState==='ship'?'SHIPPED':'DELIVERED'}</span>`);
  else if(dd<0) b.push('<span class="badge b-over">OVERDUE</span>');
  if(c.rush && !caseDone(c)) b.push('<span class="badge b-rush">RUSH</span>');
  if(wfOf(c).endState==='inhouse') b.push('<span class="badge b-house">IN-HOUSE</span>');
  if(c.linkedTo) b.push(`<span class="badge b-link">⧉ ${c.linkedTo}</span>`);
  if(c.tracks.ng && !ngDone(c)) b.push('<span class="badge b-ng">NG TRACK</span>');
  if(c.hold && !caseDone(c)) b.push('<span class="badge b-flag">⏸ HOLD</span>');
  if(c.flag) b.push('<span class="badge b-flag">⚑ FLAG</span>');
  if(isStalled(c)) b.push('<span class="badge b-stall">STALLED</span>');
  return b.join(' ');
}
function currentLabel(c){
  const cs = currentSteps(c);
  if(!cs.length) return 'Complete';
  return cs.map(s=>`${s.def.n}${s.blocked?' (gated)':''}${s.def.approval?' · ⏳ waiting on doctor':''}${s.def.d!==s.def.n?' · '+s.def.d:''}${s.def.approval?'':(s.st.assignee?' · '+tech(s.st.assignee).name:' · unassigned')}`).join('  +  ');
}

function pipelineCard(){
  const dept=state.pipeDept;
  const rows=[];
  CASES.filter(c=>!caseDone(c) && !c.voided).forEach(c=>{
    const wf=wfOf(c);
    const ngRem = c.tracks.ng? stepDefs(c,'ng').reduce((a,d,i)=>a+(c.tracks.ng.steps[i].status!=='done'?d.h:0),0) : 0;
    for(const track of Object.keys(c.tracks)){
      const cur=trackIdx(c,track); if(cur===-1) continue;
      const defs=stepDefs(c,track);
      if(defs[cur].d===dept) continue;                   // already with us — not "incoming"
      let hrs=0, hit=null, gated=false;
      for(let i=cur;i<defs.length;i++){
        if(track==='main' && wf.joinAt===i && c.tracks.ng && ngRem>0) gated=true;   // the NG gate sits on (or at) the way
        if(defs[i].d===dept){ hit=defs[i]; break; }
        hrs+=defs[i].h;
      }
      if(!hit) continue;
      if(gated) hrs+=ngRem;                              // that work must also finish before we see the case
      const s=currentSteps(c).find(x=>x.track===track);
      rows.push({c, track, cur:defs[cur], st:s?s.st:null, blocked:s?s.blocked:false, hrs, hit, gated});
    }
  });
  rows.sort((a,b)=>new Date(a.c.ship)-new Date(b.c.ship));
  const hereN=CASES.filter(c=>!caseDone(c) && currentSteps(c).some(x=>x.def.d===dept)).length;
  return `<div class="card">
    <h3 style="display:flex; align-items:center; gap:8px;">Pipeline →
      <select class="field" style="padding:3px 8px; font-size:12px; font-weight:700; text-transform:none;" onchange="state.pipeDept=this.value; render();">
        ${DEPTS.map(d=>`<option ${state.pipeDept===d?'selected':''}>${d}</option>`).join('')}
      </select>
    </h3>
    <div class="subtle" style="margin-bottom:6px;"><b>${hereN}</b> at ${dept} now · <b>${rows.length}</b> on the way. Why isn't it here yet? Read the middle column.</div>
    ${rows.length? rows.map(r=>{
      let where = `${r.cur.n} · ${r.cur.d}`;
      if(r.c.hold) where += ' · ⏸ HOLD';
      else if(r.cur.approval) where += ' · ⏳ doctor';
      else if(r.st && r.st.status==='in') where += ` · ${tech(r.st.assignee).name} working`;
      else if(r.st && r.st.assignee) where += ` · ${tech(r.st.assignee).name} queued`;
      else where += ' · unassigned';
      if(isStalled(r.c)) where += ' · 🐌 stalled';
      const eta = r.c.hold? 'held — no ETA' : `~${r.hrs.toFixed(1)}h${r.gated?' incl. NG':''} → ${r.hit.n}`;
      return `<div class="pipe-row" onclick="openCase('${r.c.id}')">
        <div class="cid" style="border-left:4px solid ${WF_COLORS[r.c.wf]}; padding-left:6px;">${r.c.id}</div>
        <div class="cmeta" style="flex:1; min-width:0;">
          <div class="l1" style="font-size:12.5px;">${esc(r.c.patient)} ${r.track==='ng'?'<span class="badge b-ng">NG</span>':''} ${r.c.rush?'<span class="badge b-rush">RUSH</span>':''}</div>
          <div class="l2">${esc(where)}</div>
          <div class="l2" style="color:var(--accent);">${esc(eta)}</div>
        </div>
        <div class="ship">${shipLabel(r.c)}</div>
      </div>`;
    }).join('') : `<div class="empty">Nothing upstream is headed to ${dept}. Either great news or very bad news.</div>`}
  </div>`;
}

function vCal(){
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+state.calMonth);
  const y=base.getFullYear(), mo=base.getMonth();
  const firstDow=(new Date(y,mo,1).getDay()+6)%7;            // Monday-first
  const daysIn=new Date(y,mo+1,0).getDate();
  const monthName=base.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell off" style="border:none; background:none;"></div>');
  for(let d=1;d<=daysIn;d++){
    const date=new Date(y,mo,d);
    const off=dayDiff(date);
    const closed=!isWorkday(date);
    const due=CASES.filter(c=>!caseDone(c) && dayDiff(new Date(c.ship))===off);
    const doneHere=CASES.filter(c=>caseDone(c) && !c.voided && dayDiff(new Date(c.ship))===off);
    const out=TECHS.filter(t=>BENCHABLE(t) && isOutOn(t.id,off));
    const dots=due.slice(0,4).map(c=>`<i style="background:${WF_COLORS[c.wf]}"></i>`).join('') + (due.length>4?`<span class="cal-more">+${due.length-4}</span>`:'');
    cells.push(`<div class="cal-cell ${off===0?'today':''} ${state.calSel===off?'sel':''}" style="${closed?'opacity:.45; background:var(--page);':''}" onclick="state.calSel=${off}; render();">
      <div class="dnum">${d}</div>
      <div class="cal-dots">${dots}${doneHere.length?'<span class="cal-more" style="color:var(--good-text)">✓'+doneHere.length+'</span>':''}</div>
      ${out.length?`<span class="cal-out">🏖${out.length}</span>`:''}
    </div>`);
  }
  return `
    ${state.boardMsg? `<div class="assign-hint" style="border:1px solid var(--baseline);">${esc(state.boardMsg)}</div>`:''}
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" onclick="state.calMonth--; state.calSel=null; render();">‹</button>
        <b>${monthName}</b>
        <button class="cal-nav" onclick="state.calMonth++; state.calSel=null; render();">›</button>
      </div>
      <div class="cal">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="subtle" style="margin-top:8px;">Dots = cases due (colored by type) · ✓ = delivered · 🏖 = people out. Dimmed days = lab closed (we run Mon–Thu). Tap a day to drill in.</div>
    </div>
    ${state.calSel!==null? vCalDay(state.calSel):''}`;
}
function vCalDay(off){
  const date=daysFromNow(off);
  const label=date.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  const due=CASES.filter(c=>!caseDone(c) && dayDiff(new Date(c.ship))===off);
  const delivered=CASES.filter(c=>caseDone(c) && !c.voided && dayDiff(new Date(c.ship))===off);
  const out=TECHS.filter(t=>BENCHABLE(t) && isOutOn(t.id,off));
  const dueHrs=due.reduce((a,c)=>{
    for(const track of Object.keys(c.tracks)){ const defs=stepDefs(c,track); c.tracks[track].steps.forEach((st,i)=>{ if(st.status!=='done') a+=defs[i].h; }); }
    return a;
  },0);
  return `<div class="card">
    <h3>${label} ${off===0?'· today':off===1?'· tomorrow':''}</h3>
    ${out.length? `<div class="assign-hint">🏖 Out: ${out.map(t=>t.name).join(', ')}</div>`:''}
    ${due.length? `<div class="track-title">${due.length} due · ~${dueHrs.toFixed(1)}h of work remaining on them</div>${due.map(caseRow).join('')}`
      : delivered.length? '' : '<div class="empty">Nothing due. A quiet day, allegedly.</div>'}
    ${delivered.length? `<div class="track-title" style="margin-top:8px;">✓ Delivered</div>${delivered.map(caseRow).join('')}`:''}
    ${isLead() && off>=0? `

/* ===================== chat hub ===================== */
function fmtChatWhen(d){
  const dd = dayDiff(new Date(d));
  if(dd===0) return new Date(d).toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
  if(dd===-1) return 'yesterday';
  return fmtDate(new Date(d));
}
function lastMsg(c){ return c.notes.length? c.notes[c.notes.length-1] : null; }
function threadTime(c){ const m=lastMsg(c); return m? new Date(m.when).getTime() : new Date(c.created).getTime(); }
function apprNeeded(c){ return caseDone(c)? null : (currentSteps(c).find(s=>s.track==='main' && s.def.approval)||null); }
function openThread(cid){ state.chatOpen=cid; state.chatRead[cid]=Date.now(); render(); }
function approveChat(cid){
  const c=getCase(cid);
  const s=apprNeeded(c);
  if(!s || !canApprove()) return;
  logEvt(c, `${s.def.n} — approved by ${me().name}`, 'step');
  completeStep(c, 'main', s.idx, state.userId);
  c.notes.push({who:me().name, when:now(), text:`✅ Approved: ${s.def.n}`});
  state.chatRead[cid]=Date.now();
  render();
}
function apprCard(c){
  const s=apprNeeded(c);
  if(!s) return '';
  return `<div class="appr-card">
    ⏳ <b>${esc(s.def.n)}</b> needs sign-off · ${esc(c.doctor)}
    ${canApprove()? `<div class="btnrow"><button class="btn primary" onclick="approveChat('${c.id}')">✓ Approve</button></div>`
      : `<div class="subtle" style="margin-top:4px;">Waiting on the Design Lead or Dr. Weiss. ${state.role==='frontdesk'?'(You can record a phoned-in doctor approval from the case page.)':''}</div>`}
  </div>`;
}
function vChat(){
  if(state.chatOpen){

    return `

    <div class="card">
      ${threads.length? threads.map(c=>{
        const m=lastMsg(c);

        const ap=apprNeeded(c);
        return `<div class="thread-row" onclick="openThread('${c.id}')">
          <div class="tr-avatar" style="background:${WF_COLORS[c.wf]}">${esc(c.patient.slice(0,2).toUpperCase())}</div>
          <div class="tr-main">
            <div class="tr-top"><b>${c.id}</b> <span class="subtle">${esc(c.patient)}</span>
              ${ap?'<span class="badge b-flag">⏳ APPROVAL</span>':''} ${c.rush&&!caseDone(c)?'<span class="badge b-rush">RUSH</span>':''} ${c.hold&&!caseDone(c)?'<span class="badge b-flag">⏸</span>':''} ${caseDone(c)?'<span class="badge b-done">✓</span>':''}
            </div>
            <div class="tr-prev">${m? `<b>${esc(m.who.split(' ')[0])}:</b> ${m.ping?'👉 ':''}${esc(m.text)}` : '<i>No messages yet</i>'}</div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
            <span class="tr-when">${m? fmtChatWhen(m.when) : ''}</span>
            ${unread? '<span class="unread-dot"></span>':''}
          </div>
        </div>`;
      }).join('') : '<div class="empty">No threads yet.</div>'}
    </div>`;
}

/* ===================== cases ===================== */
function applyFilters(){
  const f = state.caseFilter, tf = state.typeFilter, s = state.search.toLowerCase();
  let list = CASES.slice();
  if(s) list = list.filter(c=>(c.id+' '+c.patient+' '+c.doctor+' '+c.clinic+' '+wfOf(c).name).toLowerCase().includes(s));
  // a typed search on the default chip spans ALL statuses ("did it ship?" lookups);
  // an explicitly chosen chip still applies, combined with the search
  if(!(s && f==='all')){
    if(f==='today') list = list.filter(c=>!caseDone(c) && dayDiff(new Date(c.ship))===0);
    else if(f==='overdue') list = list.filter(c=>!caseDone(c) && dayDiff(new Date(c.ship))<0);
    else if(f==='unassigned') list = list.filter(c=>currentSteps(c).some(x=>!x.st.assignee && !x.blocked && !x.def.approval));
    else if(f==='flagged') list = list.filter(c=>!caseDone(c) && (c.flag || c.nudges.length));
    else if(f==='inhouse') list = list.filter(c=>wfOf(c).endState==='inhouse');
    else if(f==='done') list = list.filter(c=>caseDone(c));
    else list = list.filter(c=>!caseDone(c));
  }
  if(tf!=='all') list = list.filter(c=>c.wf===tf);
  if(state.deptFilter!=='all') list = list.filter(c=>currentSteps(c).some(s=>s.def.d===state.deptFilter));
  list.sort((a,b)=>new Date(a.ship)-new Date(b.ship));
  return list;
}
function vCases(){
  const f = state.caseFilter, tf = state.typeFilter;

  return `

    </div>
    <div class="filters">
      <select class="field" style="padding:5px 10px; font-size:12px; border-radius:12px;" onchange="state.deptFilter=this.value; state.appliedCustom=null; render();">

      <button class="fchip" onclick="openModal({type:'savefilter'})">☆ Save current filter…</button>

/* ===================== case sheet ===================== */
function trackHtml(c, track){
  const defs = stepDefs(c,track);
  const cur = trackIdx(c,track);
  return defs.map((d,i)=>{
    const st = c.tracks[track].steps[i];
    const cls = st.status==='done'?'done': (i===cur ? (st.status==='in'?'in':'') : '');
    const active = i===cur;
    const blocked = active && isBlocked(c,track,i);
    let info = `${d.d} · ${d.h}h est${dueLabel(c, track, i, st)}`;
    if(st.assignee) info += ` · ${tech(st.assignee).name}`;
    if(st.status==='in') info += ` · checked in ${fmtWhen(new Date(st.start))}`;
    if(st.status==='done' && st.end) info += ` · done ${fmtWhen(new Date(st.end))}`;
    if(d.approval) info += active? ' · ⏳ waiting on doctor' : ' · doctor approval';
    const fork = track==='main' && wfOf(c).forkAfter===i && wfOf(c).ng;
    return `<div class="step ${cls}">
      <div class="rail"><div class="dot"></div><div class="line"></div></div>
      <div class="sbody">
        <div class="sname">${d.n} ${blocked?'<span class="badge b-stall">GATED — waiting on NG track</span>':''} ${active && !blocked && !st.assignee && !d.approval ? '<span class="badge b-link">unassigned</span>':''}</div>
        <div class="sinfo">${info}</div>
        ${active && !d.approval && isLead() && !caseDone(c) ? `
          <select class="field" style="padding:3px 8px; font-size:11.5px; margin-top:4px; max-width:230px;" onchange="sheetAssign('${c.id}','${track}',${i},this.value)">
            <option value="">${st.assignee? '⇄ reassign…':'＋ assign…'}</option>
            ${assignOptions(d, st.assignee)}
            ${st.assignee? `<option value="__clear__">↥ return to queue</option>`:''}
          </select>`:''}
        ${fork ? (c.tracks.ng ? `
          <div class="ng-track">
            <div class="track-title" style="margin-top:8px;"><span class="badge b-ng">NG</span> Night guard — parallel track</div>
            ${trackHtml(c,'ng')}
          </div>` : `<div class="subtle" style="margin-top:4px;">⑂ Night-guard track starts after this step</div>`) : ''}
      </div>
    </div>`;
  }).join('');
}
